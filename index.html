<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Market Intelligence · Daily Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
<style>
  /* Beyond Insights brand palette — clean neutral base, magenta accent */
  :root {
    --paper:      #f8f9fa;
    --paper-alt:  #f1f3f6;
    --paper-sub:  #e8ecf0;
    --surface:    #ffffff;
    --ink-0:      #111827;
    --ink-1:      #1f2937;
    --ink-2:      #374151;
    --ink-3:      #6b7280;
    --ink-4:      #9ca3af;
    --ink-5:      #d1d5db;
    --rule:       rgba(0,0,0,0.07);
    --rule-2:     rgba(0,0,0,0.13);
    --accent:     #c6006f;
    --accent-sub: #fce8f3;
    --bull:       #166534;
    --bull-bg:    #dcfce7;
    --bull-sub:   #f0fdf4;
    --bull-rgb:   22,101,52;
    --bear:       #991b1b;
    --bear-bg:    #fee2e2;
    --bear-sub:   #fef2f2;
    --bear-rgb:   153,27,27;
    --mixed:      #92400e;
    --mixed-bg:   #fef3c7;
    --mixed-sub:  #fffbeb;
    --mixed-rgb:  146,64,14;
    --neutral:    #4b5563;
    --neutral-bg: #f3f4f6;
    --neutral-rgb:75,85,99;
    --p1:         #c6006f;
    --p2:         #0079c1;
    --p3:         #9ca3af;
    --bi-blue:    #0079c1;
    --bi-navy:    #203c6c;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--paper-sub); }
  body { font-family: "Montserrat", system-ui, sans-serif; color: var(--ink-1); }
  #root { width: 100%; height: 100vh; display: flex; flex-direction: column; }
  ::selection { background: var(--accent-sub); color: var(--ink-0); }
  * { scrollbar-width: thin; scrollbar-color: var(--ink-5) transparent; }
  *::-webkit-scrollbar { width: 4px; height: 4px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: var(--ink-5); border-radius: 2px; }

  /* Loading screen */
  #loading {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--paper); gap: 14px;
    font-family: "Montserrat", sans-serif;
    z-index: 999;
    transition: opacity .3s;
  }
  #loading.fade { opacity: 0; pointer-events: none; }
  .spinner {
    width: 28px; height: 28px;
    border: 2.5px solid var(--rule-2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-label {
    font-family: "Montserrat", sans-serif;
    font-size: 15px; font-weight: 700;
    color: var(--ink-1); letter-spacing: .06em; text-transform: uppercase;
  }
  .loading-sub {
    font-size: 11px; color: var(--ink-3);
    letter-spacing: .08em; text-transform: uppercase;
  }
</style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  <div class="loading-label">Market Intelligence</div>
  <div class="loading-sub">Fetching today's brief…</div>
</div>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>

<script type="text/babel">
// ─── Design tokens + shared primitives ──────────────────────────────────────

window.HF = (() => {
  const T = {
    paper:      'var(--paper)',
    paperAlt:   'var(--paper-alt)',
    paperSub:   'var(--paper-sub)',
    surface:    'var(--surface)',
    ink0:       'var(--ink-0)',
    ink1:       'var(--ink-1)',
    ink2:       'var(--ink-2)',
    ink3:       'var(--ink-3)',
    ink4:       'var(--ink-4)',
    ink5:       'var(--ink-5)',
    rule:       'var(--rule)',
    rule2:      'var(--rule-2)',
    accent:     'var(--accent)',
    accentSub:  'var(--accent-sub)',
    bull:       'var(--bull)',
    bullBg:     'var(--bull-bg)',
    bullSub:    'var(--bull-sub)',
    bear:       'var(--bear)',
    bearBg:     'var(--bear-bg)',
    bearSub:    'var(--bear-sub)',
    mixed:      'var(--mixed)',
    mixedBg:    'var(--mixed-bg)',
    mixedSub:   'var(--mixed-sub)',
    neutral:    'var(--neutral)',
    neutBg:     'var(--neutral-bg)',
    p1:         'var(--p1)',
    p2:         'var(--p2)',
    p3:         'var(--p3)',
    fontDisplay: '"Montserrat", system-ui, sans-serif',
    fontSerif:   '"Montserrat", system-ui, sans-serif',
    fontSans:    '"Montserrat", system-ui, sans-serif',
    fontMono:    '"Montserrat", system-ui, sans-serif',
    rSm: 3, rMd: 4, rLg: 8, rXl: 12,
  };

  const sentTone = (s) => {
    if (s === 'bull')  return { fg: T.bull,  bg: T.bullBg,  sub: T.bullSub,  label: 'Bullish' };
    if (s === 'bear')  return { fg: T.bear,  bg: T.bearBg,  sub: T.bearSub,  label: 'Bearish' };
    if (s === 'mixed') return { fg: T.mixed, bg: T.mixedBg, sub: T.mixedSub, label: 'Mixed'   };
    return { fg: T.neutral, bg: T.neutBg, sub: T.neutBg, label: 'Neutral' };
  };

  const prioColor  = (p) => p === 'P1' ? T.p1 : p === 'P2' ? T.p2 : T.p3;
  const moodColor  = (m) => m === 'bull' ? T.bull : m === 'bear' ? T.bear : m === 'mixed' ? T.mixed : T.neutral;
  const moodLabel  = (m) => m === 'bull' ? 'Bullish' : m === 'bear' ? 'Bearish' : m === 'mixed' ? 'Mixed' : 'Neutral';
  const moodFromLabel = (l) => {
    const s = (l||'').toLowerCase();
    if (s.startsWith('bull')) return 'bull';
    if (s.startsWith('bear')) return 'bear';
    if (s.startsWith('mix'))  return 'mixed';
    return 'neutral';
  };

  const Eyebrow = ({ children, color, style = {} }) => (
    <span style={{ fontFamily: T.fontSans, fontSize: 10, fontWeight: 600,
                   letterSpacing: '.12em', textTransform: 'uppercase',
                   color: color || T.ink3, ...style }}>{children}</span>
  );

  const SectionHeader = ({ label, action, style = {} }) => (
    <div style={{ display: 'flex', alignItems: 'center', gap: 10,
                  paddingBottom: 6, marginBottom: 10,
                  borderBottom: `1px solid ${T.rule2}`, ...style }}>
      <Eyebrow color={T.ink2}>{label}</Eyebrow>
      <div style={{ flex: 1 }}/>
      {action}
    </div>
  );

  const Ticker = ({ t, size = 11, style = {} }) => (
    <span style={{ fontFamily: T.fontMono, fontSize: size, fontWeight: 600,
                   color: T.ink1, background: T.surface,
                   border: `1px solid ${T.rule2}`, borderRadius: T.rSm,
                   padding: '1px 5px', letterSpacing: '.02em',
                   display: 'inline-block', ...style }}>{t}</span>
  );

  const SentBadge = ({ s, size = 10 }) => {
    const t = sentTone(s);
    return (
      <span style={{ fontFamily: T.fontSans, fontSize: size, fontWeight: 600,
                     color: t.fg, background: t.sub, border: `1px solid ${t.bg}`,
                     borderRadius: 999, padding: '1px 8px',
                     textTransform: 'uppercase', letterSpacing: '.08em',
                     display: 'inline-block' }}>{t.label}</span>
    );
  };

  const SentDot = ({ s, size = 6 }) => {
    const t = sentTone(s);
    return (
      <span style={{ display: 'inline-block', width: size, height: size,
                     borderRadius: '50%', background: t.fg, verticalAlign: 'middle' }}/>
    );
  };

  const PriorityMark = ({ p, size = 16 }) => (
    <span style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                   width: size, height: size, background: prioColor(p), color: '#fff',
                   fontFamily: T.fontMono, fontSize: size * 0.55, fontWeight: 700,
                   borderRadius: 2, lineHeight: 1 }}>{p}</span>
  );

  const CatLabel = ({ c, active = false }) => (
    <span style={{ fontFamily: T.fontSans, fontSize: 10, fontWeight: 600,
                   color: active ? T.surface : T.ink2,
                   background: active ? T.ink1 : 'transparent',
                   border: `1px solid ${active ? T.ink1 : T.rule2}`,
                   borderRadius: 2, padding: '1px 6px',
                   textTransform: 'uppercase', letterSpacing: '.08em',
                   display: 'inline-block', lineHeight: '15px' }}>{c}</span>
  );

  const Chip = ({ on, children, onClick }) => (
    <button type="button" onClick={onClick} style={{
      fontFamily: T.fontSans, fontSize: 12, fontWeight: 500,
      color: on ? T.surface : T.ink2,
      background: on ? T.ink1 : T.surface,
      border: `1px solid ${on ? T.ink1 : T.rule2}`,
      borderRadius: 999, padding: '4px 12px',
      cursor: 'pointer', whiteSpace: 'nowrap', transition: 'all .12s',
    }}>{children}</button>
  );

  return { tokens: T, sentTone, prioColor, moodColor, moodLabel, moodFromLabel,
           Eyebrow, SectionHeader, Ticker, SentBadge, SentDot, PriorityMark, CatLabel, Chip };
})();

// ─── Desktop sub-components ──────────────────────────────────────────────────

function splitSentences(text) {
  if (!text) return [];
  return text.trim().split(/\.\s+/).map(s => s.trim()).filter(Boolean);
}

function addPeriod(s) {
  return /[.!?]$/.test(s) ? s : s + '.';
}

function DigestBanner({ D }) {
  const { tokens: T, moodColor, moodLabel, Eyebrow, CatLabel } = window.HF;
  const [open, setOpen] = React.useState(true);
  const mc = moodColor(D.mood);
  const ml = moodLabel(D.mood);
  const bull = D.articles.filter(a => a.sentiment === 'bull').length;
  const bear = D.articles.filter(a => a.sentiment === 'bear').length;
  const mix  = D.articles.filter(a => a.sentiment === 'mixed').length;

  // Collapsed: single slim bar
  if (!open) {
    return (
      <div style={{ padding: '0 24px', background: T.paper,
                    borderBottom: `1px solid ${T.rule2}`,
                    display: 'flex', alignItems: 'center', gap: 12,
                    height: 36, flexShrink: 0 }}>
        <Eyebrow style={{ color: T.ink3 }}>AI Digest</Eyebrow>
        <span style={{ fontFamily: T.fontDisplay, fontSize: 14, fontWeight: 700,
                       color: mc, fontStyle: 'italic' }}>{ml}</span>
        <span style={{ width: 6, height: 6, borderRadius: '50%', background: mc, flexShrink: 0 }}/>
        <span style={{ fontFamily: T.fontMono, fontSize: 10.5, color: T.ink3,
                       fontVariantNumeric: 'tabular-nums' }}>
          <span style={{ color: T.bull }}>↑{bull}</span>
          {' · '}
          <span style={{ color: T.bear }}>↓{bear}</span>
          {' · '}
          <span style={{ color: T.mixed }}>≈{mix}</span>
        </span>
        <span style={{ width: 1, height: 14, background: T.rule2 }}/>
        <div style={{ display: 'flex', gap: 4, overflow: 'hidden' }}>
          {D.digest.themes.slice(0, 4).map(t => (
            <span key={t} style={{ whiteSpace: 'nowrap' }}><CatLabel c={t}/></span>
          ))}
          {D.digest.themes.length > 4 && (
            <Eyebrow style={{ color: T.ink4 }}>+{D.digest.themes.length - 4} more</Eyebrow>
          )}
        </div>
        <div style={{ flex: 1 }}/>
        <button onClick={() => setOpen(true)}
          style={{ display: 'flex', alignItems: 'center', gap: 5,
                   fontFamily: T.fontSans, fontSize: 11, fontWeight: 600,
                   color: T.ink3, background: 'transparent', border: 0,
                   cursor: 'pointer', padding: 0 }}>
          Show digest
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
            <path d="m6 9 6 6 6-6" stroke="currentColor" strokeWidth="1.8"
                  strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </button>
      </div>
    );
  }

  // Expanded: full banner
  return (
    <section style={{ padding: '10px 24px', background: T.paper,
                      borderBottom: `1px solid ${T.rule2}`,
                      display: 'grid',
                      gridTemplateColumns: '140px 680px 1fr',
                      gap: 16, alignItems: 'stretch',
                      position: 'relative' }}>
      <div style={{ borderRight: `1px solid ${T.rule}`, paddingRight: 16 }}>
        <Eyebrow>Today's mood</Eyebrow>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 6, marginTop: 3 }}>
          <span style={{ fontFamily: T.fontDisplay, fontSize: 24, fontWeight: 700,
                         color: mc, lineHeight: 1, fontStyle: 'italic' }}>{ml}</span>
          <span style={{ display: 'inline-block', width: 7, height: 7,
                         background: mc, borderRadius: '50%' }}/>
        </div>
        <div style={{ display: 'flex', gap: 8, marginTop: 6,
                      fontFamily: T.fontMono, fontSize: 10.5, color: T.ink2,
                      fontVariantNumeric: 'tabular-nums' }}>
          <span><b style={{ color: T.bull }}>↑</b> {bull} bull</span>
          <span><b style={{ color: T.bear }}>↓</b> {bear} bear</span>
          <span><b style={{ color: T.mixed }}>↔</b> {mix} mix</span>
        </div>
      </div>

      <div>
        <Eyebrow style={{ color: T.accent }}>AI Digest · {D.date}</Eyebrow>
        {(() => {
          const sentences = splitSentences(D.digest.body);
          if (!sentences.length) return (
            <p style={{ fontFamily: T.fontSerif, fontSize: 13, color: T.ink3,
                        margin: '4px 0 0', fontStyle: 'italic' }}>
              No digest available for this day.
            </p>
          );
          const [lead, ...rest] = sentences;
          return (
            <div style={{ marginTop: 4 }}>
              <p style={{ fontFamily: T.fontSerif, fontSize: 13, lineHeight: 1.55,
                          color: T.ink1, margin: '0 0 5px', fontWeight: 600 }}>
                {addPeriod(lead)}
              </p>
              {rest.length > 0 && (
                <ul style={{ margin: 0, paddingLeft: 15,
                             listStyleType: 'disc', listStylePosition: 'outside' }}>
                  {rest.map((s, i) => (
                    <li key={i} style={{ fontFamily: T.fontSerif, fontSize: 12.5,
                                        lineHeight: 1.5, color: T.ink2,
                                        marginBottom: 3 }}>
                      {addPeriod(s)}
                    </li>
                  ))}
                </ul>
              )}
            </div>
          );
        })()}
      </div>

      <div style={{ borderLeft: `1px solid ${T.rule}`, paddingLeft: 16 }}>
        <Eyebrow>Second-order impacts</Eyebrow>
        {(() => {
          const sentences = splitSentences(D.digest.secondOrder);
          if (!sentences.length) return (
            <p style={{ fontFamily: T.fontSerif, fontSize: 11.5, color: T.ink3,
                        margin: '3px 0 8px', fontStyle: 'italic' }}>—</p>
          );
          return (
            <ul style={{ margin: '4px 0 8px', paddingLeft: 15,
                         listStyleType: 'disc', listStylePosition: 'outside' }}>
              {sentences.map((s, i) => (
                <li key={i} style={{ fontFamily: T.fontSerif, fontSize: 11.5,
                                     lineHeight: 1.45, color: T.ink2,
                                     fontStyle: 'italic', marginBottom: 3 }}>
                  {addPeriod(s)}
                </li>
              ))}
            </ul>
          );
        })()}

        {D.digest.themes.length > 0 && (
          <>
            <Eyebrow>Key themes</Eyebrow>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 4, marginTop: 4 }}>
              {D.digest.themes.map(t => (
                <span key={t} style={{ whiteSpace: 'nowrap' }}><CatLabel c={t}/></span>
              ))}
            </div>
          </>
        )}
      </div>

      {/* Collapse button — bottom right of the banner */}
      <button onClick={() => setOpen(false)}
        style={{ position: 'absolute', bottom: 8, right: 10,
                 display: 'flex', alignItems: 'center', gap: 4,
                 fontFamily: T.fontSans, fontSize: 11, fontWeight: 600,
                 color: T.ink4, background: 'transparent', border: 0,
                 cursor: 'pointer', padding: 0 }}>
        Hide digest
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
          <path d="m18 15-6-6-6 6" stroke="currentColor" strokeWidth="1.8"
                strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      </button>
    </section>
  );
}

function HourlyTimeline({ D }) {
  const { tokens: T, Eyebrow, SentDot } = window.HF;
  const hrs = D.articles.map(a => a.hr);
  if (!hrs.length) return null;
  const HSTART = Math.min(...hrs);
  const HEND   = Math.max(...hrs);
  const span   = Math.max(1, HEND - HSTART);

  const LegendSwatch = ({ c }) => (
    <span style={{ display:'inline-block', width:8, height:8, borderRadius:'50%',
                   background:c, marginRight:5, verticalAlign:'middle' }}/>
  );
  return (
    <section style={{ padding: '12px 24px 16px', background: T.paper,
                      borderBottom: `1px solid ${T.rule2}` }}>
      <div style={{ display:'flex', alignItems:'baseline', gap:12, marginBottom:8 }}>
        <h2 style={{ fontFamily: T.fontDisplay, fontSize: 17, fontWeight: 600,
                     letterSpacing: '-.01em', margin: 0, whiteSpace: 'nowrap' }}>
          The day, by the hour
        </h2>
        <Eyebrow>{D.articles.length} stories · {D.stats.p12} priority</Eyebrow>
        <div style={{ flex: 1 }}/>
        <div style={{ display:'flex', gap:14, fontFamily: T.fontSans, fontSize:11, color: T.ink3 }}>
          <span><LegendSwatch c={T.bull}/>Bullish</span>
          <span><LegendSwatch c={T.mixed}/>Mixed</span>
          <span><LegendSwatch c={T.bear}/>Bearish</span>
          <span style={{ marginLeft:6, color: T.ink2 }}>● large = P1 · medium = P2</span>
        </div>
      </div>
      <div style={{ position:'relative', height:88, background: T.surface,
                    border:`1px solid ${T.rule2}`, borderRadius: T.rMd,
                    padding:'8px 14px 22px' }}>
        <div style={{ position:'absolute', inset:'8px 14px 22px', display:'flex' }}>
          {Array.from({ length: span + 1 }).map((_,i) => (
            <div key={i} style={{ flex:1, borderLeft: i===0 ? 'none' : `1px dashed ${T.rule}` }}/>
          ))}
        </div>
        <div style={{ position:'absolute', inset:'8px 14px 22px' }}>
          {D.articles.map(a => {
            const x = ((a.hr - HSTART) / span) * 100;
            const c = a.sentiment==='bull' ? T.bull : a.sentiment==='bear' ? T.bear :
                      a.sentiment==='mixed' ? T.mixed : T.ink3;
            const sz = a.priority==='P1' ? 14 : a.priority==='P2' ? 10 : 7;
            const y  = 6 + ((String(a.id).charCodeAt(String(a.id).length-1) * 11) % 46);
            return (
              <div key={a.id} title={`${a.time} · ${a.headline}`} style={{
                position:'absolute', left:`${x}%`, top:y,
                width:sz, height:sz, borderRadius:'50%',
                background:c, border:`1.5px solid ${T.paper}`,
                boxShadow: a.priority==='P1' ? `0 0 0 1.5px ${T.p1}` :
                           a.priority==='P2' ? `0 0 0 1px ${T.ink3}` : 'none',
                transform:'translate(-50%,0)', cursor:'pointer',
              }}/>
            );
          })}
        </div>
        <div style={{ position:'absolute', left:14, right:14, bottom:4, display:'flex',
                      fontFamily: T.fontMono, fontSize:10, color: T.ink3 }}>
          {Array.from({ length: span + 1 }).map((_,i) => (
            <div key={i} style={{ flex:1, textAlign:'left' }}>
              {String(HSTART+i).padStart(2,'0')}:00
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function FilterRow({ D, cat, setCat, prio, setPrio, sent, setSent }) {
  const { tokens: T, Chip } = window.HF;
  const cats = window.NEWS_DATA.categories;
  const Segmented = ({ value, onChange, options }) => (
    <span style={{ display:'inline-flex', borderRadius:999,
                   border:`1px solid ${T.rule2}`, background: T.surface, overflow:'hidden' }}>
      {options.map(opt => {
        const on = value === opt.v;
        return (
          <button key={opt.v} onClick={() => onChange(on ? null : opt.v)}
            style={{ fontFamily: T.fontSans, fontSize:11, fontWeight:600,
                     padding:'4px 12px', border:0, cursor:'pointer',
                     background: on ? (opt.accent || T.ink1) : 'transparent',
                     color: on ? '#fff' : T.ink2, transition:'all .12s' }}>{opt.label}</button>
        );
      })}
    </span>
  );
  return (
    <div style={{ padding:'9px 24px', background: T.surface,
                  borderBottom:`1px solid ${T.rule2}`,
                  display:'flex', gap:6, alignItems:'center', flexWrap:'wrap' }}>
      <Chip on={!cat} onClick={() => setCat(null)}>All</Chip>
      {cats.map(c => (
        <Chip key={c} on={cat===c} onClick={() => setCat(cat===c ? null : c)}>{c}</Chip>
      ))}
      <div style={{ flex:1 }}/>
      <Segmented value={prio} onChange={setPrio} options={[
        { v:'P1', label:'P1' }, { v:'P2', label:'P2' }, { v:'P3', label:'P3' },
      ]}/>
      <Segmented value={sent} onChange={setSent} options={[
        { v:'bull',  label:'Bull',  accent: T.bull  },
        { v:'bear',  label:'Bear',  accent: T.bear  },
        { v:'mixed', label:'Mixed', accent: T.mixed },
      ]}/>
    </div>
  );
}

function ActiveFilters({ searchQ, prio, sent, cat, ticker,
                          setSearchQ, setPrio, setSent, setCat, setTicker,
                          clearAll, count, total }) {
  const { tokens: T } = window.HF;
  const FilterChip = ({ label, onClear }) => (
    <span style={{ display:'inline-flex', alignItems:'center', gap:6,
                   background: T.accentSub, color: T.ink1,
                   border:`1px solid ${T.accent}`, borderRadius:999,
                   padding:'2px 4px 2px 10px',
                   fontFamily: T.fontSans, fontSize:11, fontWeight:500 }}>
      {label}
      <button onClick={onClear} style={{ display:'inline-flex', alignItems:'center',
                                         justifyContent:'center', width:16, height:16,
                                         borderRadius:'50%', background: T.accent,
                                         color:'#fff', border:0, cursor:'pointer',
                                         fontSize:11, lineHeight:1 }}>×</button>
    </span>
  );
  return (
    <div style={{ padding:'8px 24px', background: T.accentSub,
                  borderBottom:`1px solid ${T.rule2}`,
                  display:'flex', alignItems:'center', gap:8, flexWrap:'wrap' }}>

function SidebarHeatmap({ day }) {
  const { tokens: T } = window.HF;
  const D = day || window.NEWS_DATA;
  const categories = window.NEWS_DATA.categories;
  const counts = categories.map(c =>
    Array.from({ length: 6 }, (_, b) =>
      D.articles.filter(a => a.cats.includes(c) && Math.floor((a.hr - 1) / 3) === b)
    )
  );
  const max = Math.max(...counts.flat().map(arts => arts.length), 1);
  return (
    <div style={{ display:'grid', gridTemplateColumns:'74px repeat(6,1fr)', gap:2,
                  fontFamily: T.fontMono, fontSize:9 }}>
      <div/>
      {['01','04','07','10','13','16'].map((h,i) => (
        <div key={i} style={{ textAlign:'center', color: T.ink3, paddingBottom:2 }}>{h}</div>
      ))}
      {categories.map((c, ri) => (
        <React.Fragment key={c}>
          <div style={{ fontFamily: T.fontSans, fontSize:10.5, color: T.ink2, fontWeight:500,
                        lineHeight:'16px', overflow:'hidden', whiteSpace:'nowrap',
                        textOverflow:'ellipsis', paddingRight:4 }}>{c}</div>
          {counts[ri].map((arts, ci) => {
            if (!arts.length) return <div key={ci} style={{ height:18, background: T.surface, border:`1px solid ${T.rule2}` }}/>;
            const bull = arts.filter(a => a.sentiment==='bull').length;
            const bear = arts.filter(a => a.sentiment==='bear').length;
            const dom  = bull >= bear ? (bull > 0 ? 'bull' : 'mixed') : 'bear';
            const fg   = dom==='bull' ? T.bull : dom==='bear' ? T.bear : T.mixed;
            const intensity = 0.22 + 0.78 * (arts.length / max);
            const hasP1 = arts.some(a => a.priority==='P1');
            return (
              <div key={ci} title={arts.map(a => a.headline).join('\n')} style={{
                height:18, background:`color-mix(in oklab, ${fg} ${Math.round(intensity*100)}%, transparent)`,
                border:`1px solid ${T.rule2}`, position:'relative',
                display:'flex', alignItems:'center', justifyContent:'center',
                fontWeight:700, fontSize:9, color:'#fff', cursor:'pointer',
              }}>
                {arts.length}
                {hasP1 && <span style={{ position:'absolute', top:2, right:2, width:4, height:4,
                                         background:'#fff', borderRadius:'50%' }}/>}
              </div>
            );
          })}
        </React.Fragment>
      ))}
    </div>
  );
}

  const [ticker,   setTicker]   = React.useState(null);

  const filtered = React.useMemo(() => {
    const q = searchQ.trim().toLowerCase();
    return D.articles.filter(a => {
      if (prio   && a.priority !== prio) return false;

      if (cat    && !a.cats.includes(cat)) return false;
      if (ticker && !a.tickers.includes(ticker)) return false;
      if (q) {

                                 margin:'0 0 4px', color: T.ink0 }}>{a.headline}</h3>
                    <p style={{ fontFamily: T.fontSerif, fontSize:12.5, lineHeight:1.45,
                                color: T.ink2, margin:0 }}>{a.summary}</p>
                    <div style={{ display:'flex', gap:3, marginTop:6, flexWrap:'wrap' }}>
                      {a.cats.slice(0,2).map(c => <CatLabel key={c} c={c}/>)}
                      <div style={{ flex:1 }}/>
                      {a.tickers.slice(0,4).map(t => <Ticker key={t} t={t} size={10}/>)}
                    </div>
                  </article>
                );
              })}
            </div>
          </div>

          <div>
            <SectionHeader label="Top tickers · week"/>
            <div style={{ display:'flex', flexWrap:'wrap', gap:4 }}>
              {topTickers.map(([t, n]) => {
                const sz = n >= 4 ? 14 : n >= 3 ? 12.5 : n >= 2 ? 11 : 10;
                return (
                  <span key={t} style={{ display:'inline-flex', alignItems:'center', gap:5,
                                          fontFamily: T.fontMono, fontSize:sz, fontWeight:600,

          <div>
            <SectionHeader label="Themes of the week"/>

                          display:'flex', flexWrap:'wrap', gap:6, alignItems:'center' }}>
              {themes.map(([t, n]) => {

function MiniSpark({ D }) {
  const { tokens: T } = window.HF;
  const hrs = D.articles.map(a => a.hr);
  if (!hrs.length) return null;
  const HSTART = Math.min(...hrs);
  const HEND   = Math.max(...hrs);
  const span   = HEND - HSTART + 1;
  const bars   = Array.from({ length: span }, (_, i) => {
    const arts = D.articles.filter(a => a.hr === i + HSTART);
    return { bull: arts.filter(a=>a.sentiment==='bull').length,
             bear: arts.filter(a=>a.sentiment==='bear').length,
             mixed: arts.filter(a=>a.sentiment==='mixed').length };
  });
  const maxV = Math.max(...bars.map(b => b.bull+b.bear+b.mixed), 1);
  return (
    <div>
      <div style={{ display:'flex', gap:2, alignItems:'flex-end', height:32 }}>
        {bars.map((b,i) => (
          <div key={i} style={{ flex:1, display:'flex', flexDirection:'column', justifyContent:'flex-end' }}>
            {b.bear  > 0 && <div style={{ background: T.bear,  height:(b.bear/maxV)*28 }}/>}
            {b.mixed > 0 && <div style={{ background: T.mixed, height:(b.mixed/maxV)*28 }}/>}
            {b.bull  > 0 && <div style={{ background: T.bull,  height:(b.bull/maxV)*28 }}/>}
          </div>
        ))}
      </div>
      <div style={{ display:'flex', justifyContent:'space-between',
                    fontFamily: T.fontMono, fontSize:9, color: T.ink3, marginTop:3 }}>
        <span>{String(HSTART).padStart(2,'0')}</span>
        <span>{String(Math.floor((HSTART+HEND)/2)).padStart(2,'0')}</span>
        <span>{String(HEND).padStart(2,'0')}</span>
      </div>
    </div>
  );
}

function MobileDayView({ day }) {
  const { tokens: T, moodColor, moodLabel, Eyebrow, CatLabel, Chip } = window.HF;
  const D = day;
  const [searchQ, setSearchQ] = React.useState('');
  const [prio,    setPrio]    = React.useState(null);
  const [sent,    setSent]    = React.useState(null);
  const [cat,     setCat]     = React.useState(null);

  const filtered = React.useMemo(() => {
    const q = searchQ.trim().toLowerCase();
    return D.articles.filter(a => {
      if (prio && a.priority !== prio) return false;
      if (sent && a.sentiment !== sent) return false;
      if (cat  && !a.cats.includes(cat)) return false;
      if (q) {
        const blob = [a.headline, a.summary, ...a.tickers, ...a.cats, a.source].join(' ').toLowerCase();
        if (!blob.includes(q)) return false;
      }
      return true;
    });
  }, [D.articles, searchQ, prio, sent, cat]);

  const mc = moodColor(D.mood);
  const ml = moodLabel(D.mood);

  return (
    <div style={{ height:'100%', overflow:'auto', background: T.paper }}>
      <div style={{ padding:'12px 16px 10px', background: T.paper, borderBottom:`1px solid ${T.rule}` }}>
        <Eyebrow>{D.date} · refreshed {D.refreshed}</Eyebrow>

          <input value={searchQ} onChange={e => setSearchQ(e.target.value)}

          <Chip on={sent==='bull'} onClick={() => setSent(sent==='bull' ? null : 'bull')}>Bull</Chip>
          <Chip on={sent==='bear'} onClick={() => setSent(sent==='bear' ? null : 'bear')}>Bear</Chip>
          {window.NEWS_DATA.categories.map(c => (
            <Chip key={c} on={cat===c} onClick={() => setCat(cat===c ? null : c)}>{c}</Chip>
          ))}
        </div>
      </div>

      <div style={{ background: T.surface }}>
        {filtered.length === 0 ? (
          <div style={{ padding:'40px 16px', textAlign:'center', color: T.ink3 }}>
            <div style={{ fontFamily: T.fontDisplay, fontSize:16, fontWeight:600,
                          color: T.ink2, fontStyle:'italic', marginBottom:4 }}>No stories match.</div>
            <button onClick={() => { setSearchQ(''); setPrio(null); setSent(null); setCat(null); }}
              style={{ fontFamily: T.fontSans, fontSize:11, fontWeight:600,
                       color: T.accent, background:'transparent', border:0, cursor:'pointer' }}>Clear filters →</button>
          </div>
        ) : (
          filtered.map((a) => <MobileRow key={a.id} a={a} defaultOpen={false}/>)
        )}
      </div>
    </div>
  );
}

function MobileOverview({ days, onSelectDay }) {
  const { tokens: T, Eyebrow, SectionHeader, SentBadge, PriorityMark, CatLabel, Ticker, sentTone } = window.HF;
  const allArticles = days.flatMap(d => d.articles.map(a => ({ ...a, _day: d.dateShort, _dayKey: d.dateKey })));
  const totalP1   = allArticles.filter(a => a.priority==='P1').length;
  const totalBull = allArticles.filter(a => a.sentiment==='bull').length;
  const totalBear = allArticles.filter(a => a.sentiment==='bear').length;
  const tickerCounts = {};
  allArticles.forEach(a => a.tickers.forEach(t => { tickerCounts[t] = (tickerCounts[t]||0) + 1; }));
  const topTickers = Object.entries(tickerCounts).sort((a,b) => b[1]-a[1]).slice(0,12);

  const dateRange = days.length >= 2

          <span><b style={{ fontFamily: T.fontDisplay, fontSize:15, fontWeight:700, color: T.bear }}>{totalBear}</b> <span style={{ color: T.ink3 }}>↓</span></span>
        </div>
      </header>

      <section style={{ padding:'12px 16px', background: T.surface, borderBottom:`1px solid ${T.rule}` }}>

        <div>

                        gap:6, alignItems:'flex-end', height:70 }}>
            {[...days].reverse().map(d => {
              const bull  = d.articles.filter(a=>a.sentiment==='bull').length;
              const bear  = d.articles.filter(a=>a.sentiment==='bear').length;
              const mixed = d.articles.filter(a=>a.sentiment==='mixed').length;
              const total = d.stats.total;

                <button key={d.dateKey} onClick={() => onSelectDay(d.dateKey)}

                           gap:2, justifyContent:'flex-end', height:'100%' }}>
                  <span style={{ fontFamily: T.fontMono, fontSize:10, color: T.ink2, fontWeight:600 }}>{total}</span>
                  <div style={{ width:'70%', display:'flex', flexDirection:'column',
                                justifyContent:'flex-end', overflow:'hidden', borderRadius:2,
                                boxShadow:`inset 0 0 0 1px ${T.rule2}` }}>
                    {bear  > 0 && <div style={{ height: segH(bear),  background: T.bear  }}/>}

                <p style={{ fontFamily: T.fontDisplay, fontWeight:600, fontSize:13.5,
                             lineHeight:1.25, margin:0, color: T.ink0,
                             display:'-webkit-box', WebkitLineClamp:2,
                             WebkitBoxOrient:'vertical', overflow:'hidden' }}>
                  {d.digest.body ? d.digest.body.substring(0,120) + '…' : `${d.dateShort} market brief`}

                <div style={{ display:'flex', gap:8, fontFamily: T.fontMono, fontSize:10, color: T.ink2 }}>

                             color: T.accent, background:'transparent', border:0,
                             padding:0, cursor:'pointer' }}>{a._day}</button>
                  <span style={{ fontFamily: T.fontMono, fontSize:10, color: T.ink2 }}>· {a.time}</span>
                  <div style={{ flex:1 }}/>

// ─── Desktop shell + tab nav ─────────────────────────────────────────────────

function DashboardShell({ tabs, active, onSelect, onRefresh, loading, children }) {
  const { tokens: T, moodColor } = window.HF;
  const Tab = ({ label, eyebrow, active, onClick, accent, mood }) => {
    const mc = moodColor(mood);
    const activeBorder = accent ? T.accent : T.ink0;
    return (
      <button onClick={onClick} style={{ background:'transparent', border:0, cursor:'pointer',
                                          padding:'12px 18px 10px',
                                          borderBottom:`2px solid ${active ? activeBorder : 'transparent'}`,
                                          display:'flex', flexDirection:'column', alignItems:'flex-start', gap:2,
                                          transition:'background .12s', color: T.ink1 }}
        onMouseEnter={e => { if (!active) e.currentTarget.style.background = T.paperSub; }}
        onMouseLeave={e => { if (!active) e.currentTarget.style.background = 'transparent'; }}>
        <span style={{ fontFamily: T.fontSans, fontSize:9, fontWeight:600,
                       textTransform:'uppercase', letterSpacing:'.12em',
                       color: active ? (accent ? T.accent : T.ink2) : T.ink4 }}>{eyebrow}</span>
        <span style={{ display:'flex', alignItems:'center', gap:6 }}>
          <span style={{ fontFamily: T.fontDisplay, fontWeight: active ? 700 : 500,
                         fontSize:15, lineHeight:1, letterSpacing:'.01em',
                         color: active ? T.ink0 : T.ink3 }}>{label}</span>
          {mood && <span style={{ width:6, height:6, borderRadius:'50%', background: mc }}/>}
        </span>
      </button>
    );
  };

  return (
    <div style={{ background: T.paper, height:'100%', overflow:'hidden',
                  display:'flex', flexDirection:'column',
                  fontFamily: T.fontSans, color: T.ink1 }}>
      <nav style={{ display:'flex', alignItems:'stretch', gap:0,
                    padding:'0 24px', background: T.surface,
                    borderBottom:`1px solid ${T.rule2}` }}>
        <Tab label="5-day overview" eyebrow="overview"
             active={active==='overview'} onClick={() => onSelect('overview')} accent/>
        {tabs.map((d, i) => (
          <Tab key={d.dateKey} label={d.dateShort}
               eyebrow={i===0 ? 'today' : i===1 ? 'yesterday' : `${i} days ago`}
               active={active===d.dateKey} onClick={() => onSelect(d.dateKey)} mood={d.mood}/>
        ))}
        <div style={{ flex:1 }}/>
        <button onClick={onRefresh} disabled={loading}
          style={{ alignSelf:'center', marginRight:8,
                   fontFamily: T.fontSans, fontSize:11, fontWeight:600,
                   color: loading ? T.ink4 : T.ink2,
                   background:'transparent', border:`1px solid ${T.rule2}`,
                   borderRadius:999, padding:'5px 12px', cursor: loading ? 'default' : 'pointer',
                   display:'flex', alignItems:'center', gap:6 }}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
               style={{ animation: loading ? 'spin .7s linear infinite' : 'none' }}>
            <path d="M21 12a9 9 0 1 1-9-9 9 9 0 0 1 6.35 2.65L21 9V3h-6l2.18 2.18" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
          {loading ? 'Refreshing…' : 'Refresh'}
        </button>
      </nav>
      <div style={{ flex:1, minHeight:0, position:'relative' }}>{children}</div>
    </div>
  );
}

// ─── Root app ────────────────────────────────────────────────────────────────

function App() {
  const [data,    setData]    = React.useState(null);
  const [error,   setError]   = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const [activeTab, setActiveTab] = React.useState('overview');
  const [isMobile, setIsMobile]   = React.useState(window.innerWidth < 768);

  React.useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth < 768);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  const fetchData = React.useCallback(() => {
    setLoading(true);
    fetch('/api/data')
      .then(r => { if (!r.ok) throw new Error(`Server returned ${r.status}`); return r.json(); })
      .then(d => {
        if (d.error) throw new Error(d.error);
        window.NEWS_DATA = d;
        setData(d);
        setError(null);
      })
      .catch(e => setError(e.message))
      .finally(() => {
        setLoading(false);
        const el = document.getElementById('loading');
        if (el) { el.classList.add('fade'); setTimeout(() => el.remove(), 350); }
      });
  }, []);

  React.useEffect(() => { fetchData(); }, [fetchData]);

  if (error) {
    return (
      <div style={{ display:'flex', flexDirection:'column', alignItems:'center',
                    justifyContent:'center', height:'100vh',
                    background:'var(--paper)', gap:14, padding:24, textAlign:'center' }}>
        <div style={{ fontFamily:'"Newsreader",serif', fontSize:22, fontWeight:600,
                      color:'var(--ink-2)', fontStyle:'italic' }}>Could not load data</div>
        <div style={{ fontFamily:'"Hanken Grotesk",sans-serif', fontSize:13, color:'var(--ink-3)',
                      maxWidth:420, lineHeight:1.5 }}>{error}</div>
        <button onClick={fetchData}
          style={{ fontFamily:'"Hanken Grotesk",sans-serif', fontSize:13, fontWeight:600,
                   color:'#fff', background:'var(--accent)', border:0,
                   borderRadius:999, padding:'9px 22px', cursor:'pointer' }}>Try again</button>
      </div>
    );
  }

  if (!data) return null;

  if (isMobile) return <HifiMobile/>;

  return (
    <DashboardShell tabs={data.days} active={activeTab} onSelect={setActiveTab}
                    onRefresh={fetchData} loading={loading}>
      {activeTab === 'overview'
        ? <HifiOverview days={data.days} onSelectDay={setActiveTab}/>
        : <HifiDesktop day={data.days.find(d => d.dateKey === activeTab) || data.days[0]}/>}
    </DashboardShell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
