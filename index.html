<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Market Intelligence · Daily Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Beyond Insights brand palette — broadsheet light / dark */
  :root {
    --paper:      #FEFCF8;
    --paper-alt:  #F9F6F0;
    --paper-sub:  #F2EDE3;
    --surface:    #ffffff;
    --ink-0:      #1B2B4B;
    --ink-1:      #1B2B4B;
    --ink-2:      #3D4F6E;
    --ink-3:      #6B7C9A;
    --ink-4:      #A8B4C8;
    --ink-5:      #D8E0EC;
    --rule:       rgba(184,176,164,0.5);
    --rule-2:     rgba(184,176,164,0.8);
    --accent:     #FF8C69;
    --accent-sub: rgba(255,140,105,0.10);
    --bull:       #1A5C38;
    --bull-bg:    #d4edda;
    --bull-sub:   #eaf5ee;
    --bull-rgb:   26,92,56;
    --bear:       #B83232;
    --bear-bg:    #f5d5d5;
    --bear-sub:   #faeaea;
    --bear-rgb:   184,50,50;
    --mixed:      #8A6800;
    --mixed-bg:   #f5e8c0;
    --mixed-sub:  #faf3dc;
    --mixed-rgb:  138,104,0;
    --neutral:    #4A5568;
    --neutral-bg: #EDF2F7;
    --neutral-rgb:74,85,104;
    --p1:         #FF8C69;
    --p2:         #4A6CF7;
    --p3:         #A8B4C8;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --paper:      #0D1B2A;
    --paper-alt:  #152338;
    --paper-sub:  #0A1520;
    --surface:    #152338;
    --ink-0:      #EAF0F8;
    --ink-1:      #EAF0F8;
    --ink-2:      #A8BECE;
    --ink-3:      #6E8CA8;
    --ink-4:      #3D566E;
    --ink-5:      #243D55;
    --rule:       rgba(60,100,140,0.35);
    --rule-2:     rgba(60,100,140,0.55);
    --accent:     #E8A020;
    --accent-sub: rgba(232,160,32,0.12);
    --bull:       #2ECC8A;
    --bull-bg:    rgba(46,204,138,0.15);
    --bull-sub:   rgba(46,204,138,0.08);
    --bull-rgb:   46,204,138;
    --bear:       #FF5A5A;
    --bear-bg:    rgba(255,90,90,0.15);
    --bear-sub:   rgba(255,90,90,0.08);
    --bear-rgb:   255,90,90;
    --mixed:      #FFB347;
    --mixed-bg:   rgba(255,179,71,0.15);
    --mixed-sub:  rgba(255,179,71,0.08);
    --mixed-rgb:  255,179,71;
    --neutral:    #6E8CA8;
    --neutral-bg: rgba(110,140,168,0.15);
    --neutral-rgb:110,140,168;
    --p1:         #E8A020;
    --p2:         #5B9BD5;
    --p3:         #3D566E;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { margin: 0; padding: 0; height: 100%; background: var(--paper-sub); }
  body { margin: 0; padding: 0; min-height: 100%; background: var(--paper-sub);
         font-family: "Inter", system-ui, sans-serif; color: var(--ink-1); }
  #root {
    width: 100%; height: 100vh;
    max-width: 1320px; margin: 0 auto;
    display: flex; flex-direction: column;
    box-shadow: 0 0 48px rgba(0,0,0,0.13);
    position: relative;
  }
  ::selection { background: var(--accent-sub); color: var(--ink-0); }
  * { scrollbar-width: thin; scrollbar-color: var(--ink-5) transparent; }
  *::-webkit-scrollbar { width: 4px; height: 4px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: var(--ink-5); border-radius: 2px; }

  /* Password gate */
  #pw-gate {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--paper-sub);
    font-family: "Inter", system-ui, sans-serif;
  }

  /* Loading screen */
  #loading {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--paper); gap: 14px;
    font-family: "Inter", sans-serif;
    z-index: 999;
    transition: opacity .3s;
  }
  #loading.fade { opacity: 0; pointer-events: none; }
  .spinner {
    width: 28px; height: 28px;
    border: 2.5px solid var(--rule-2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-label {
    font-family: "Playfair Display", serif;
    font-size: 18px; font-weight: 700;
    color: var(--ink-1); letter-spacing: .02em; font-style: italic;
  }
  .loading-sub {
    font-size: 11px; color: var(--ink-3);
    font-family: "Inter", sans-serif;
    letter-spacing: .08em; text-transform: uppercase;
  }
</style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  <div class="loading-label">Market Intelligence</div>
  <div class="loading-sub">Fetching today's brief…</div>
</div>
<div id="root"></div>

<script>
  (function() {
    // Theme init
    var saved = localStorage.getItem('mi-theme');
    var preferred = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', preferred);
  })();
</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>

<script type="text/babel">
// ─── Password gate ───────────────────────────────────────────────────────────

function PasswordGate({ children }) {
  const AUTH_KEY   = 'mi-auth';
  const AUTH_TOKEN = 'bianalyst-ok';

  const [authed,   setAuthed]   = React.useState(() => localStorage.getItem(AUTH_KEY) === AUTH_TOKEN);
  const [pw,       setPw]       = React.useState('');
  const [error,    setError]    = React.useState(false);
  const [shake,    setShake]    = React.useState(false);
  const inputRef = React.useRef(null);

  React.useEffect(() => {
    if (!authed && inputRef.current) inputRef.current.focus();
  }, [authed]);

  const attempt = () => {
    if (pw.trim().toLowerCase() === 'bianalyst') {
      localStorage.setItem(AUTH_KEY, AUTH_TOKEN);
      setAuthed(true);
      setError(false);
    } else {
      setError(true);
      setShake(true);
      setPw('');
      setTimeout(() => setShake(false), 600);
      if (inputRef.current) inputRef.current.focus();
    }
  };

  if (authed) return children;

  return (
    <div style={{
      position: 'fixed', inset: 0, zIndex: 9999,
      display: 'flex', flexDirection: 'column',
      alignItems: 'center', justifyContent: 'center',
      background: 'var(--paper-sub)',
      fontFamily: '"Inter", system-ui, sans-serif',
    }}>
      {/* Card */}
      <div style={{
        background: 'var(--surface)',
        border: '1px solid var(--rule-2)',
        borderTop: '3px solid var(--ink-0)',
        borderRadius: 6,
        padding: '44px 48px 40px',
        width: '100%', maxWidth: 400,
        boxShadow: '0 8px 32px rgba(0,0,0,0.12)',
        animation: shake ? 'shake 0.5s ease' : 'none',
      }}>
        {/* Logo area */}
        <div style={{ marginBottom: 28, textAlign: 'center' }}>
          <div style={{
            fontFamily: '"Playfair Display", Georgia, serif',
            fontSize: 28, fontWeight: 800,
            letterSpacing: '-0.5px',
            color: 'var(--ink-0)', lineHeight: 1,
            textTransform: 'uppercase',
          }}>
            Market <span style={{ color: 'var(--accent)' }}>Intelligence</span>
          </div>
          <div style={{
            fontFamily: '"Inter", system-ui, sans-serif',
            fontSize: 10, fontWeight: 600,
            letterSpacing: '.14em', textTransform: 'uppercase',
            color: 'var(--ink-3)', marginTop: 7,
          }}>
            Beyond Insights · Daily Market Brief
          </div>
        </div>

        {/* Divider */}
        <div style={{ height: 1, background: 'var(--rule-2)', marginBottom: 28 }}/>

        {/* Label */}
        <div style={{
          fontFamily: '"Inter", system-ui, sans-serif',
          fontSize: 11, fontWeight: 600,
          letterSpacing: '.1em', textTransform: 'uppercase',
          color: 'var(--ink-3)', marginBottom: 10,
        }}>
          Access password
        </div>

        {/* Input */}
        <input
          ref={inputRef}
          type="password"
          value={pw}
          onChange={e => { setPw(e.target.value); setError(false); }}
          onKeyDown={e => e.key === 'Enter' && attempt()}
          placeholder="Enter password…"
          style={{
            width: '100%', padding: '11px 14px',
            fontFamily: '"Inter", system-ui, sans-serif', fontSize: 14,
            background: 'var(--paper-alt)', color: 'var(--ink-1)',
            border: `1.5px solid ${error ? 'var(--bear)' : 'var(--rule-2)'}`,
            borderRadius: 4, outline: 'none',
            transition: 'border-color .15s',
            marginBottom: error ? 8 : 16,
            boxShadow: error ? '0 0 0 3px rgba(184,50,50,0.10)' : 'none',
          }}
        />

        {/* Error message */}
        {error && (
          <div style={{
            fontFamily: '"Inter", system-ui, sans-serif',
            fontSize: 12, color: 'var(--bear)',
            marginBottom: 14, letterSpacing: '.01em',
          }}>
            Incorrect password. Please try again.
          </div>
        )}

        {/* Submit button */}
        <button onClick={attempt} style={{
          width: '100%', padding: '11px',
          fontFamily: '"Inter", system-ui, sans-serif',
          fontSize: 13, fontWeight: 700,
          letterSpacing: '.06em', textTransform: 'uppercase',
          background: 'var(--ink-0)', color: '#fff',
          border: 'none', borderRadius: 4, cursor: 'pointer',
          transition: 'opacity .15s',
        }}
          onMouseEnter={e => e.currentTarget.style.opacity = '.85'}
          onMouseLeave={e => e.currentTarget.style.opacity = '1'}>
          Enter
        </button>
      </div>

      {/* Footer */}
      <div style={{
        marginTop: 20,
        fontFamily: '"Inter", system-ui, sans-serif',
        fontSize: 11, color: 'var(--ink-4)',
        letterSpacing: '.04em',
      }}>
        Restricted access · Beyond Insights
      </div>

      <style>{`
        @keyframes shake {
          0%,100% { transform: translateX(0); }
          20%      { transform: translateX(-8px); }
          40%      { transform: translateX(8px); }
          60%      { transform: translateX(-6px); }
          80%      { transform: translateX(6px); }
        }
      `}</style>
    </div>
  );
}

// ─── Design tokens + shared primitives ──────────────────────────────────────

window.HF = (() => {
  const T = {
    paper:      'var(--paper)',
    paperAlt:   'var(--paper-alt)',
    paperSub:   'var(--paper-sub)',
    surface:    'var(--surface)',
    ink0:       'var(--ink-0)',
    ink1:       'var(--ink-1)',
    ink2:       'var(--ink-2)',
    ink3:       'var(--ink-3)',
    ink4:       'var(--ink-4)',
    ink5:       'var(--ink-5)',
    rule:       'var(--rule)',
    rule2:      'var(--rule-2)',
    accent:     'var(--accent)',
    accentSub:  'var(--accent-sub)',
    bull:       'var(--bull)',
    bullBg:     'var(--bull-bg)',
    bullSub:    'var(--bull-sub)',
    bear:       'var(--bear)',
    bearBg:     'var(--bear-bg)',
    bearSub:    'var(--bear-sub)',
    mixed:      'var(--mixed)',
    mixedBg:    'var(--mixed-bg)',
    mixedSub:   'var(--mixed-sub)',
    neutral:    'var(--neutral)',
    neutBg:     'var(--neutral-bg)',
    p1:         'var(--p1)',
    p2:         'var(--p2)',
    p3:         'var(--p3)',
    fontDisplay: '"Playfair Display", Georgia, serif',
    fontSerif:   '"Playfair Display", Georgia, serif',
    fontSans:    '"Inter", system-ui, sans-serif',
    fontMono:    '"Inter", system-ui, sans-serif',
    rSm: 3, rMd: 4, rLg: 8, rXl: 12,
  };

  const sentTone = (s) => {
    if (s === 'bull')  return { fg: T.bull,  bg: T.bullBg,  sub: T.bullSub,  label: 'Bullish' };
    if (s === 'bear')  return { fg: T.bear,  bg: T.bearBg,  sub: T.bearSub,  label: 'Bearish' };
    if (s === 'mixed') return { fg: T.mixed, bg: T.mixedBg, sub: T.mixedSub, label: 'Mixed'   };
    return { fg: T.neutral, bg: T.neutBg, sub: T.neutBg, label: 'Neutral' };
  };

  const prioColor  = (p) => p === 'P1' ? T.p1 : p === 'P2' ? T.p2 : T.p3;
  const moodColor  = (m) => m === 'bull' ? T.bull : m === 'bear' ? T.bear : m === 'mixed' ? T.mixed : T.neutral;
  const moodLabel  = (m) => m === 'bull' ? 'Bullish' : m === 'bear' ? 'Bearish' : m === 'mixed' ? 'Mixed' : 'Neutral';
  const moodFromLabel = (l) => {
    const s = (l||'').toLowerCase();
    if (s.startsWith('bull')) return 'bull';
    if (s.startsWith('bear')) return 'bear';
    if (s.startsWith('mix'))  return 'mixed';
    return 'neutral';
  };

  const Eyebrow = ({ children, color, style = {} }) => (
    <span style={{ fontFamily: T.fontSans, fontSize: 10, fontWeight: 600,
                   letterSpacing: '.12em', textTransform: 'uppercase',
                   color: color || T.ink3, ...style }}>{children}</span>
  );

  const SectionHeader = ({ label, action, style = {} }) => (
    <div style={{ display: 'flex', alignItems: 'center', gap: 10,
                  paddingBottom: 6, marginBottom: 10,
                  borderBottom: `1px solid ${T.rule2}`, ...style }}>
      <Eyebrow color={T.ink2}>{label}</Eyebrow>
      <div style={{ flex: 1 }}/>
      {action}
    </div>
  );

  const Ticker = ({ t, size = 11, style = {} }) => (
    <span style={{ fontFamily: T.fontMono, fontSize: size, fontWeight: 600,
                   color: T.ink1, background: T.surface,
                   border: `1px solid ${T.rule2}`, borderRadius: T.rSm,
                   padding: '1px 5px', letterSpacing: '.02em',
                   display: 'inline-block', ...style }}>{t}</span>
  );

  const SentBadge = ({ s, size = 10 }) => {
    const t = sentTone(s);
    return (
      <span style={{ fontFamily: T.fontSans, fontSize: size, fontWeight: 600,
                     color: t.fg, background: t.sub, border: `1px solid ${t.bg}`,
                     borderRadius: 999, padding: '1px 8px',
                     textTransform: 'uppercase', letterSpacing: '.08em',
                     display: 'inline-block' }}>{t.label}</span>
    );
  };

  const SentDot = ({ s, size = 6 }) => {
    const t = sentTone(s);
    return (
      <span style={{ display: 'inline-block', width: size, height: size,
                     borderRadius: '50%', background: t.fg, verticalAlign: 'middle' }}/>
    );
  };

  const PriorityMark = ({ p, size = 16 }) => (
    <span style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                   width: size, height: size, background: prioColor(p), color: '#fff',
                   fontFamily: T.fontMono, fontSize: size * 0.55, fontWeight: 700,
                   borderRadius: 2, lineHeight: 1 }}>{p}</span>
  );

  const CatLabel = ({ c, active = false }) => (
    <span style={{ fontFamily: T.fontSans, fontSize: 10, fontWeight: 600,
                   color: active ? T.surface : T.ink2,
                   background: active ? T.ink1 : T.paper,
                   border: `1px solid ${active ? T.ink1 : T.rule2}`,
                   borderRadius: 2, padding: '1px 6px',
                   textTransform: 'uppercase', letterSpacing: '.08em',
                   display: 'inline-block', lineHeight: '15px' }}>{c}</span>
  );

  const Chip = ({ on, children, onClick }) => (
    <button type="button" onClick={onClick} style={{
      fontFamily: T.fontSans, fontSize: 12, fontWeight: 600,
      color: on ? T.surface : T.ink1,
      background: on ? T.ink1 : T.surface,
      border: `1px solid ${on ? T.ink1 : T.rule2}`,
      borderRadius: 999, padding: '4px 14px',
      cursor: 'pointer', whiteSpace: 'nowrap', transition: 'all .12s',
      boxShadow: on ? 'none' : '0 1px 2px rgba(0,0,0,0.06)',
    }}>{children}</button>
  );

  return { tokens: T, sentTone, prioColor, moodColor, moodLabel, moodFromLabel,
           Eyebrow, SectionHeader, Ticker, SentBadge, SentDot, PriorityMark, CatLabel, Chip };
})();

// ─── Desktop sub-components ──────────────────────────────────────────────────

function splitSentences(text) {
  if (!text) return [];
  return text.trim().split(/\.\s+/).map(s => s.trim()).filter(Boolean);
}

function addPeriod(s) {
  return /[.!?]$/.test(s) ? s : s + '.';
}

function DigestBanner({ D }) {
  const { tokens: T, moodColor, moodLabel, CatLabel } = window.HF;
  const [open, setOpen] = React.useState(true);
  const [tab,  setTab]  = React.useState('brief'); // 'brief' | 'second' | 'trading'
  const mc = moodColor(D.mood);
  const ml = moodLabel(D.mood);
  const bull = D.articles.filter(a => a.sentiment === 'bull').length;
  const bear = D.articles.filter(a => a.sentiment === 'bear').length;
  const mix  = D.articles.filter(a => a.sentiment === 'mixed').length;

  const eyebrowStyle = {
    fontFamily: T.fontSans, fontSize: 9.5, fontWeight: 700,
    letterSpacing: '.18em', textTransform: 'uppercase', color: T.accent,
  };

  const TABS = [
    { id: 'brief',   label: 'Market Brief' },
    { id: 'second',  label: 'Second Order' },
    { id: 'trading', label: 'Trading Brief' },
  ];

  // Reusable sentence list renderer
  const SentencePanel = ({ text, leadQuote, emptyMsg, accentColor }) => {
    const sentences = splitSentences(text);
    if (!sentences.length) return (
      <p style={{ fontFamily: T.fontDisplay, fontSize: 13, color: T.ink3,
                  margin: 0, fontStyle: 'italic' }}>{emptyMsg}</p>
    );
    if (leadQuote) {
      const [lead, ...rest] = sentences;
      return (
        <div>
          <p style={{
            fontFamily: T.fontDisplay, fontSize: 15, fontStyle: 'italic',
            lineHeight: 1.6, color: T.ink0, margin: '0 0 12px',
            paddingLeft: 22, position: 'relative',
          }}>
            <span style={{
              position: 'absolute', left: 0, top: -4,
              fontFamily: T.fontDisplay, fontSize: 38,
              color: accentColor || T.accent, lineHeight: 1,
            }}>"</span>
            {addPeriod(lead)}
          </p>
          {rest.length > 0 && (
            <ul style={{ margin: 0, padding: 0, listStyle: 'none',
                         display: 'flex', flexDirection: 'column', gap: 6 }}>
              {rest.map((s, i) => (
                <li key={i} style={{
                  fontFamily: T.fontSans, fontSize: 13, lineHeight: 1.55,
                  color: T.ink2, paddingLeft: 14, position: 'relative',
                }}>
                  <span style={{ position: 'absolute', left: 0, top: 8,
                                 width: 5, height: 1, background: T.ink4, display: 'block' }}/>
                  {addPeriod(s)}
                </li>
              ))}
            </ul>
          )}
        </div>
      );
    }
    return (
      <ul style={{ margin: 0, padding: 0, listStyle: 'none',
                   display: 'flex', flexDirection: 'column', gap: 10 }}>
        {sentences.map((s, i) => (
          <li key={i} style={{
            fontFamily: T.fontSans, fontSize: 13, lineHeight: 1.5,
            color: T.ink2, paddingLeft: 14, position: 'relative',
          }}>
            <span style={{ position: 'absolute', left: 0, top: 8,
                           width: 5, height: 1, background: T.ink4, display: 'block' }}/>
            {addPeriod(s)}
          </li>
        ))}
      </ul>
    );
  };

  // Collapsed: slim bar
  if (!open) {
    return (
      <div onClick={() => setOpen(true)} style={{
        background: T.surface, cursor: 'pointer',
        border: `1px solid ${T.rule2}`, borderTop: `3px solid ${T.ink0}`,
        borderRadius: 4, marginBottom: 32,
        display: 'flex', alignItems: 'center', gap: 12,
        padding: '0 20px', height: 38, flexShrink: 0,
        boxShadow: '0 1px 4px rgba(0,0,0,0.06)',
      }}>
        <span style={eyebrowStyle}>AI Digest</span>
        <span style={{ width: 1, height: 14, background: T.rule2 }}/>
        <span style={{ fontFamily: T.fontDisplay, fontSize: 14, fontWeight: 600,
                       color: mc, fontStyle: 'italic' }}>{ml}</span>
        <span style={{ fontFamily: T.fontSans, fontSize: 11, color: T.ink3 }}>
          <span style={{ color: T.bull }}>↑{bull}</span>
          {' · '}
          <span style={{ color: T.bear }}>↓{bear}</span>
          {' · '}
          <span style={{ color: T.mixed }}>≈{mix}</span>
        </span>
        <div style={{ flex: 1 }}/>
        <span style={{ fontFamily: T.fontSans, fontSize: 11, color: T.ink4 }}>
          Show digest ▾
        </span>
      </div>
    );
  }

  // Expanded: tab-based editorial box
  return (
    <div style={{
      background: T.surface,
      border: `1px solid ${T.rule2}`, borderTop: `3px solid ${T.ink0}`,
      borderRadius: 4, marginBottom: 32,
      boxShadow: '0 2px 10px rgba(0,0,0,0.08)',
    }}>
      {/* Header row — clickable to collapse */}
      <div onClick={() => setOpen(false)}
        style={{
          display: 'flex', alignItems: 'center', gap: 10,
          padding: '10px 20px 8px',
          borderBottom: `1px solid ${T.rule}`,
          cursor: 'pointer', userSelect: 'none',
          transition: 'background .12s',
        }}
        onMouseEnter={e => e.currentTarget.style.background = 'rgba(0,0,0,0.025)'}
        onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
        <span style={eyebrowStyle}>AI Digest</span>
        <span style={{ width: 1, height: 12, background: T.rule2 }}/>
        <span style={{ fontFamily: T.fontDisplay, fontSize: 15, fontWeight: 600,
                       fontStyle: 'italic', color: mc }}>{ml}</span>
        <span style={{ display: 'inline-block', width: 6, height: 6,
                       borderRadius: '50%', background: mc }}/>
        <span style={{ fontFamily: T.fontSans, fontSize: 11, color: T.ink3 }}>
          <span style={{ color: T.bull }}>↑{bull}</span>
          {' · '}
          <span style={{ color: T.bear }}>↓{bear}</span>

function HourlyTimeline({ D }) {
  const { tokens: T, Eyebrow, SentDot } = window.HF;
  const hrs = D.articles.map(a => a.hr);
  if (!hrs.length) return null;
  const HSTART = Math.min(...hrs);
  const HEND   = Math.max(...hrs);
  const span   = Math.max(1, HEND - HSTART);

  const LegendSwatch = ({ c }) => (
    <span style={{ display:'inline-block', width:8, height:8, borderRadius:'50%',
                   background:c, marginRight:5, verticalAlign:'middle' }}/>
  );
  return (
    <section style={{ padding: '12px 24px 16px', background: T.paper,
                      borderBottom: `1px solid ${T.rule2}` }}>
      <div style={{ display:'flex', alignItems:'baseline', gap:12, marginBottom:8 }}>
        <h2 style={{ fontFamily: T.fontDisplay, fontSize: 17, fontWeight: 600,
                     letterSpacing: '-.01em', margin: 0, whiteSpace: 'nowrap' }}>
          The day, by the hour
        </h2>
        <Eyebrow>{D.articles.length} stories · {D.stats.p12} priority</Eyebrow>
        <div style={{ flex: 1 }}/>
        <div style={{ display:'flex', gap:14, fontFamily: T.fontSans, fontSize:11, color: T.ink3 }}>
          <span><LegendSwatch c={T.bull}/>Bullish</span>
          <span><LegendSwatch c={T.mixed}/>Mixed</span>
          <span><LegendSwatch c={T.bear}/>Bearish</span>
          <span style={{ marginLeft:6, color: T.ink2 }}>● large = P1 · medium = P2</span>
        </div>
      </div>
      <div style={{ position:'relative', height:88, background: T.surface,
                    border:`1px solid ${T.rule2}`, borderRadius: T.rMd,
                    padding:'8px 14px 22px' }}>
        <div style={{ position:'absolute', inset:'8px 14px 22px', display:'flex' }}>
          {Array.from({ length: span + 1 }).map((_,i) => (
            <div key={i} style={{ flex:1, borderLeft: i===0 ? 'none' : `1px dashed ${T.rule}` }}/>
          ))}
        </div>
        <div style={{ position:'absolute', inset:'8px 14px 22px' }}>
          {D.articles.map(a => {
            const x = ((a.hr - HSTART) / span) * 100;
            const c = a.sentiment==='bull' ? T.bull : a.sentiment==='bear' ? T.bear :
                      a.sentiment==='mixed' ? T.mixed : T.ink3;
            const sz = a.priority==='P1' ? 14 : a.priority==='P2' ? 10 : 7;
            const y  = 6 + ((String(a.id).charCodeAt(String(a.id).length-1) * 11) % 46);
            return (
              <div key={a.id} title={`${a.time} · ${a.headline}`} style={{
                position:'absolute', left:`${x}%`, top:y,
                width:sz, height:sz, borderRadius:'50%',
                background:c, border:`1.5px solid ${T.paper}`,
                boxShadow: a.priority==='P1' ? `0 0 0 1.5px ${T.p1}` :
                           a.priority==='P2' ? `0 0 0 1px ${T.ink3}` : 'none',
                transform:'translate(-50%,0)', cursor:'pointer',
              }}/>
            );
          })}
        </div>
        <div style={{ position:'absolute', left:14, right:14, bottom:4, display:'flex',
                      fontFamily: T.fontMono, fontSize:10, color: T.ink3 }}>
          {Array.from({ length: span + 1 }).map((_,i) => (
            <div key={i} style={{ flex:1, textAlign:'left' }}>
              {String(HSTART+i).padStart(2,'0')}:00
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function SidebarHeatmap({ day, activeCat, activeBucket, onCellClick }) {
  const { tokens: T } = window.HF;
  const D = day || window.NEWS_DATA;
  const categories = window.NEWS_DATA.categories;
  // 6 buckets of 4 hours each, covering full 24h: 00–03, 04–07, 08–11, 12–15, 16–19, 20–23
  const counts = categories.map(c =>
    Array.from({ length: 6 }, (_, b) =>
      D.articles.filter(a => a.cats.includes(c) && Math.floor(a.hr / 4) === b)
    )
  );
  const max = Math.max(...counts.flat().map(arts => arts.length), 1);
  return (
    <div style={{ display:'grid', gridTemplateColumns:'74px repeat(6,1fr)', gap:2,
                  fontFamily: T.fontMono, fontSize:9 }}>
      <div/>
      {['00','04','08','12','16','20'].map((h,i) => (
        <div key={i} style={{ textAlign:'center', color: T.ink3, paddingBottom:2 }}>{h}</div>
      ))}
      {categories.map((c, ri) => (
        <React.Fragment key={c}>
          <div style={{ fontFamily: T.fontSans, fontSize:10.5, color: T.ink2, fontWeight:500,
                        lineHeight:'16px', overflow:'hidden', whiteSpace:'nowrap',
                        textOverflow:'ellipsis', paddingRight:4 }}>{c}</div>
          {counts[ri].map((arts, ci) => {
            const isActive = activeCat instanceof Set ? (activeCat.has(c) && activeBucket === ci) : (activeCat === c && activeBucket === ci);
            if (!arts.length) return (
              <div key={ci} style={{ height:18, background: T.surface, border:`1px solid ${T.rule2}` }}/>
            );
            const bull = arts.filter(a => a.sentiment==='bull').length;
            const bear = arts.filter(a => a.sentiment==='bear').length;
            const dom  = bull >= bear ? (bull > 0 ? 'bull' : 'mixed') : 'bear';
            const fg   = dom==='bull' ? T.bull : dom==='bear' ? T.bear : T.mixed;
            const intensity = 0.22 + 0.78 * (arts.length / max);
            const hasP1 = arts.some(a => a.priority==='P1');
            return (
              <div key={ci}
                onClick={() => onCellClick && onCellClick(c, ci)}
                title={`${c} · ${['00','04','08','12','16','20'][ci]}:00 — ${arts.length} ${arts.length===1?'story':'stories'}\n${arts.map(a=>a.headline).join('\n')}`}
                style={{
                  height:18,
                  background: isActive
                    ? T.ink0
                    : `color-mix(in oklab, ${fg} ${Math.round(intensity*100)}%, transparent)`,
                  border: isActive ? `2px solid ${T.accent}` : `1px solid ${T.rule2}`,
                  position:'relative',
                  display:'flex', alignItems:'center', justifyContent:'center',
                  fontWeight:700, fontSize:9,
                  color: isActive ? T.accent : '#fff',
                  cursor:'pointer',
                  transition: 'border .1s, background .1s',
                }}>
                {arts.length}
                {hasP1 && <span style={{ position:'absolute', top:2, right:2, width:4, height:4,
                                         background: isActive ? T.accent : '#fff', borderRadius:'50%' }}/>}
              </div>
            );
          })}
        </React.Fragment>
      ))}
    </div>
  );
}

function HifiDesktop({ day, searchQ, setSearchQ, initialCat }) {
  const D = day || window.NEWS_DATA;
  const { tokens: T, Eyebrow, SectionHeader, SentBadge } = window.HF;

  const [prio,     setPrio]     = React.useState(new Set());
  const [sent,     setSent]     = React.useState(new Set());
  const [cat,      setCat]      = React.useState(initialCat ? new Set([initialCat]) : new Set());

  // Sync when navigating from overview heatmap with a pre-set category
  React.useEffect(() => { setCat(initialCat ? new Set([initialCat]) : new Set()); setBucket(null); }, [initialCat]);
  const [ticker,   setTicker]   = React.useState(null);
  const [bucket,   setBucket]   = React.useState(null); // set only via heatmap click

  const BUCKET_LABELS = ['00:00–03:59','04:00–07:59','08:00–11:59','12:00–15:59','16:00–19:59','20:00–23:59'];

  const togglePrio = (v) => setPrio(prev => { const n = new Set(prev); n.has(v) ? n.delete(v) : n.add(v); return n; });
  const toggleSent = (v) => setSent(prev => { const n = new Set(prev); n.has(v) ? n.delete(v) : n.add(v); return n; });
  const toggleCat  = (c) => {
    if (!c) { setCat(new Set()); setBucket(null); return; }
    setCat(prev => { const n = new Set(prev); n.has(c) ? n.delete(c) : n.add(c); return n; });
    if (bucket !== null) setBucket(null); // clear time filter when cats change manually
  };

  const filtered = React.useMemo(() => {
    const q = searchQ.trim().toLowerCase();
    return D.articles.filter(a => {
      if (prio.size   > 0 && !prio.has(a.priority)) return false;
      if (sent.size   > 0 && !sent.has(a.sentiment)) return false;
      if (cat.size    > 0 && !a.cats.some(c => cat.has(c))) return false;
      if (ticker && !a.tickers.includes(ticker)) return false;
      if (bucket !== null && Math.floor(a.hr / 4) !== bucket) return false;
      if (q) {
        const blob = [a.headline, a.summary, ...a.tickers, ...a.cats, a.source, a.implication]
                       .join(' ').toLowerCase();
        if (!blob.includes(q)) return false;
      }
      return true;
    });
  }, [D.articles, searchQ, prio, sent, cat, ticker, bucket]);

  const byHour = {};
  filtered.forEach(a => { (byHour[a.hr] = byHour[a.hr] || []).push(a); });
  const hours = Object.keys(byHour).map(Number).sort((a,b) => b - a);
  const anyFilter = !!(searchQ || prio.size > 0 || sent.size > 0 || cat.size > 0 || ticker || bucket !== null);
  const clearAll  = () => { setSearchQ(''); setPrio(new Set()); setSent(new Set()); setCat(new Set()); setTicker(null); setBucket(null); };
  const onTickerClick = (t) => setTicker(curr => curr === t ? null : t);

  // Heatmap cell click: replaces cat selection with exactly this one cat + sets bucket
  const onHeatmapClick = (clickedCat, clickedBucket) => {
    const alreadyActive = cat.size === 1 && cat.has(clickedCat) && bucket === clickedBucket;
    if (alreadyActive) {
      setCat(new Set()); setBucket(null);
    } else {
      setCat(new Set([clickedCat])); setBucket(clickedBucket);
    }
  };

  // Sidebar section — template style with top border separator
  const SidebarSection = ({ label, count, children, first }) => (
    <section style={{
      borderTop: first ? 'none' : `2px solid ${T.ink0}`,
      paddingTop: first ? 0 : 14,
      marginTop: first ? 0 : 24,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        marginBottom: 14,
      }}>
        <span style={{ fontFamily: T.fontSans, fontSize: 9.5, fontWeight: 700,
                       letterSpacing: '.18em', textTransform: 'uppercase', color: T.ink0 }}>
          {label}
        </span>
        {count != null && (
          <span style={{ fontFamily: T.fontSans, fontSize: 10, color: T.ink3 }}>{count}</span>
        )}
      </div>
      {children}
    </section>
  );

  return (
    <div style={{ background: T.paper, height: '100%', overflow: 'hidden',
                  fontFamily: T.fontSans, color: T.ink1, display: 'flex', flexDirection: 'column' }}>

      {/* ── Filter row — always visible, never scrolls away ────────── */}
      <div style={{ flexShrink: 0, padding: '0 28px', background: T.surface,
                    borderBottom: `1px solid ${T.rule2}`,
                    boxShadow: '0 1px 4px rgba(0,0,0,0.05)' }}>
        <FilterRow D={D} cat={cat} toggleCat={toggleCat} prio={prio} togglePrio={togglePrio}
                   sent={sent} toggleSent={toggleSent}/>
        {anyFilter && (
          <ActiveFilters searchQ={searchQ} prio={prio} sent={sent} cat={cat} ticker={ticker}
                         bucket={bucket} bucketLabel={bucket !== null ? BUCKET_LABELS[bucket] : null}
                         setSearchQ={setSearchQ} togglePrio={togglePrio} toggleSent={toggleSent}
                         toggleCat={toggleCat} setTicker={setTicker} setBucket={setBucket}
                         clearAll={clearAll}
                         count={filtered.length} total={D.articles.length}/>
        )}
      </div>

      {/* ── Two independent scroll panels ────────────────────────── */}
      <div style={{ flex: 1, display: 'grid', gridTemplateColumns: '1fr 280px',
                    minHeight: 0, overflow: 'hidden' }}>

        {/* Left panel — articles scroll */}
        <main id="feed-main"
          onScroll={e => {
            const btn = document.getElementById('scroll-top-btn');
            if (btn) btn.style.opacity = e.currentTarget.scrollTop > 300 ? '1' : '0';
          }}
          style={{ overflow: 'auto', padding: '28px 24px 48px 28px',
                   background: T.paper,
                   display: 'flex', flexDirection: 'column' }}>

          {/* Digest — first item in scroll, reads naturally then scrolls away */}
          <DigestBanner D={D}/>

          {hours.length === 0 ? (
            <div style={{ padding: '60px 24px', textAlign: 'center',
                          background: T.paperAlt, border: `1px dashed ${T.rule2}`,
                          borderRadius: 4 }}>
              <div style={{ fontFamily: T.fontDisplay, fontSize: 22, fontWeight: 600,
                             color: T.ink2, marginBottom: 6, fontStyle: 'italic' }}>
                No stories match.
              </div>
              <button onClick={clearAll}
                style={{ fontFamily: T.fontSans, fontSize: 12, fontWeight: 600, color: '#fff',
                         background: T.ink1, border: 0, borderRadius: 999,
                         padding: '7px 18px', cursor: 'pointer' }}>Clear all filters</button>
            </div>
          ) : (
            hours.map(h => (
              <HourBlock key={h} hour={h} articles={byHour[h]}
                         selectedTicker={ticker} onTickerClick={onTickerClick}/>
            ))
          )}

          {/* Scroll-to-top — sticky at bottom-right of this column */}
          <div style={{ position: 'sticky', bottom: 14, display: 'flex',
                        justifyContent: 'flex-end', pointerEvents: 'none',
                        marginTop: 'auto', paddingTop: 12 }}>
            <button id="scroll-top-btn"
              onClick={() => { const el = document.getElementById('feed-main');
                               if (el) el.scrollTo({ top: 0, behavior: 'smooth' }); }}
              style={{ pointerEvents: 'auto', width: 34, height: 34, borderRadius: '50%',
                       background: T.ink1, color: '#fff', border: 'none', cursor: 'pointer',
                       display: 'flex', alignItems: 'center', justifyContent: 'center',
                       boxShadow: '0 2px 10px rgba(0,0,0,.25)',
                       opacity: 0, transition: 'opacity .2s' }}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
                <path d="M18 15 12 9l-6 6" stroke="currentColor" strokeWidth="2.5"
                      strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </button>
          </div>
        </main>

        {/* Right panel — sidebar scrolls independently */}
        <aside style={{ overflow: 'auto', background: T.paper,
                        padding: '28px 20px 48px 0' }}>

          {/* Single white card containing all sidebar sections */}
          <div style={{ background: T.surface, borderRadius: 4,
                        boxShadow: '0 1px 5px rgba(0,0,0,0.08)',
                        padding: '20px 18px' }}>

          <SidebarSection label="Tickers in news" count={D.tickers.length} first>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 4 }}>
              {D.tickers.map(t => {
                const n = D.articles.filter(a => a.tickers.includes(t)).length;
                const active = ticker === t;
                return (
                  <button key={t} onClick={() => onTickerClick(t)} style={{
                    display: 'inline-flex', alignItems: 'center', gap: 4,
                    fontFamily: T.fontSans, fontSize: 11, fontWeight: 600,
                    background: active ? T.accent : T.paperAlt,
                    color: active ? '#fff' : T.ink1,
                    border: `1px solid ${active ? T.accent : T.rule2}`,
                    borderRadius: 3, padding: '2px 6px', cursor: 'pointer', transition: 'all .12s',
                  }}>
                    {t}
                    <span style={{ fontFamily: T.fontSans, fontSize: 9, fontWeight: 500,
                                   color: active ? '#fff' : T.ink4, padding: '0 3px' }}>{n}</span>
                  </button>
                );
              })}
            </div>
          </SidebarSection>

          <SidebarSection label="Past digests">
            <div style={{ display: 'flex', flexDirection: 'column' }}>
              {window.NEWS_DATA.days.map((p, i, arr) => {
                const isCurrent = p.dateKey === D.dateKey;
                return (
                  <div key={p.dateKey} style={{
                    display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                    padding: '6px 0',
                    borderBottom: i < arr.length - 1 ? `1px solid ${T.rule}` : 'none',
                    background: isCurrent ? T.accentSub : 'transparent',
                  }}>
                    <span style={{ fontFamily: T.fontDisplay, fontSize: 13, fontStyle: 'italic',
                                   fontWeight: isCurrent ? 700 : 400,
                                   color: isCurrent ? T.ink0 : T.ink2 }}>
                      {p.dateShort}
                      {isCurrent && <span style={{ color: T.accent, fontSize: 10, marginLeft: 4,
                                                    fontStyle: 'normal' }}>· now</span>}
                    </span>
                    <SentBadge s={p.mood === 'neutral' ? null : p.mood} size={9}/>
                  </div>
                );
              })}
            </div>
          </SidebarSection>

          <SidebarSection label="Heatmap · cat × hour" count={`${D.stats.total} stories`}>
            <SidebarHeatmap day={D} activeCat={cat} activeBucket={bucket} onCellClick={onHeatmapClick}/>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 6,
                          fontFamily: T.fontSans, fontSize: 10, color: T.ink3 }}>
              <span><span style={{ display: 'inline-block', width: 6, height: 6,
                                   background: T.bull, marginRight: 4 }}/>bull</span>
              <span><span style={{ display: 'inline-block', width: 6, height: 6,
                                   background: T.mixed, marginRight: 4 }}/>mixed</span>
              <span><span style={{ display: 'inline-block', width: 6, height: 6,
                                   background: T.bear, marginRight: 4 }}/>bear</span>
            </div>
          </SidebarSection>

          <SidebarSection label="Today's run">
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6 }}>
              {[['P1 + P2', D.stats.p12], ['Total', D.stats.total],
                ['Sources', D.stats.sources], ['Tickers', D.tickers.length]].map(([l, n]) => (
                <div key={l} style={{ background: T.paperAlt, border: `1px solid ${T.rule2}`,
                                      borderRadius: T.rMd, padding: '6px 8px' }}>
                  <div style={{ fontFamily: T.fontDisplay, fontSize: 22, fontWeight: 700,
                                lineHeight: 1, fontVariantNumeric: 'tabular-nums' }}>{n}</div>
                  <div style={{ fontFamily: T.fontSans, fontSize: 10, color: T.ink3,
                                marginTop: 2, textTransform: 'uppercase',
                                letterSpacing: '.08em' }}>{l}</div>
                </div>
              ))}
            </div>
          </SidebarSection>

          </div>{/* end single white sidebar card */}
        </aside>
      </div>
    </div>
  );
}

// ─── Overview ────────────────────────────────────────────────────────────────

function HifiOverview({ days, weekThemes, onSelectDay }) {
  const { tokens: T, sentTone, Eyebrow, SectionHeader, Ticker, SentBadge, SentDot, PriorityMark, CatLabel } = window.HF;

  const allArticles = days.flatMap(d => d.articles.map(a => ({ ...a, _day: d.dateShort, _dayKey: d.dateKey })));
  const totalP1   = allArticles.filter(a => a.priority === 'P1').length;

  const totalBear = allArticles.filter(a => a.sentiment === 'bear').length;

  const topP1 = allArticles.filter(a => a.priority === 'P1').slice(0,5);

  const themes = weekThemes && weekThemes.length > 0 ? weekThemes : [];

    <div style={{ background: T.paper, height: '100%', overflow: 'auto',

                    boxShadow: '0 2px 8px rgba(0,0,0,0.06)' }}>
        <div style={{ fontFamily: T.fontSans, fontSize: 9.5, fontWeight: 700,

        <h1 style={{ fontFamily: T.fontDisplay, fontWeight: 800, fontSize: 28, lineHeight: 1.05,
                     margin: '0 0 12px', letterSpacing: '-.015em', color: T.ink0 }}>

        </h1>
        <div style={{ display: 'flex', alignItems: 'center', gap: 20,
                      fontFamily: T.fontSans, fontSize: 12, color: T.ink2 }}>
          {[['ink0', allArticles.length, 'stories'],
            ['p1',   totalP1,           'P1 priority'],
            ['bull', totalBull,         'bullish'],
            ['bear', totalBear,         'bearish'],
            ['ink0', Object.keys(tickerCounts).length, 'tickers'],
          ].map(([clr, n, lbl]) => (
            <span key={lbl}>
              <b style={{ fontFamily: T.fontDisplay, fontSize: 20, fontWeight: 700,
                          color: T[clr], marginRight: 4 }}>{n}</b>
              <span style={{ color: T.ink3 }}>{lbl}</span>

        </div>
      </div>

      <div style={{ maxWidth: 1320, margin: '0 auto', padding: '24px 28px 48px',
                    display: 'flex', flexDirection: 'column', gap: 28 }}>

        {/* Day cards */}
        <section>
          <div style={{ fontFamily: T.fontSans, fontSize: 9.5, fontWeight: 700,
                        letterSpacing: '.16em', textTransform: 'uppercase', color: T.ink2,
                        marginBottom: 14, paddingBottom: 8,
                        borderBottom: `2px solid ${T.ink0}` }}>
            Day by Day — Click to Drill In
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: `repeat(${days.length}, 1fr)`, gap: 12 }}>
            {days.map(d => {
              const mc = d.mood === 'bull' ? T.bull : d.mood === 'bear' ? T.bear :
                         d.mood === 'mixed' ? T.mixed : T.neutral;
              const bull = d.articles.filter(a => a.sentiment === 'bull').length;
              const bear = d.articles.filter(a => a.sentiment === 'bear').length;
              return (
                <button key={d.dateKey} onClick={() => onSelectDay(d.dateKey)}
                  style={{ textAlign: 'left', background: T.surface, fontFamily: T.fontSans,
                           border: `1px solid ${T.rule2}`, borderTop: `3px solid ${mc}`,
                           borderRadius: 4, padding: '14px 16px', cursor: 'pointer',
                           display: 'flex', flexDirection: 'column', gap: 8, color: T.ink1,
                           boxShadow: '0 1px 5px rgba(0,0,0,0.07)',
                           transition: 'box-shadow .15s' }}
                  onMouseEnter={e => e.currentTarget.style.boxShadow = '0 4px 16px rgba(0,0,0,.10)'}
                  onMouseLeave={e => e.currentTarget.style.boxShadow = '0 1px 5px rgba(0,0,0,0.07)'}>
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                    <span style={{ fontFamily: T.fontDisplay, fontSize: 18, fontWeight: 700,
                                   fontStyle: 'italic', color: T.ink0 }}>
                      {d.dateShort}
                    </span>
                    <SentBadge s={d.mood === 'neutral' ? null : d.mood} size={9}/>
                  </div>
                  <div style={{ fontFamily: T.fontSans, fontSize: 10, fontWeight: 600,
                                letterSpacing: '.10em', textTransform: 'uppercase', color: T.ink4 }}>
                    {d.stats.total} stories · {d.stats.p12} priority

                  <p style={{ fontFamily: T.fontDisplay, fontWeight: 600, fontSize: 13.5,

                    {d.digest.body ? d.digest.body.substring(0, 140) + '…' : `${d.dateShort} market brief`}

                  {d.digest.tradingBrief && (
                    <p style={{ fontFamily: T.fontSans, fontSize: 11, lineHeight: 1.4,

                                display: '-webkit-box', WebkitLineClamp: 2,
                                WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>
                      {d.digest.tradingBrief.substring(0, 110) + '…'}

                  )}
                  <div style={{ display: 'flex', gap: 8, marginTop: 'auto', paddingTop: 4,
                                fontFamily: T.fontSans, fontSize: 11, color: T.ink2 }}>
                    <span style={{ color: T.bull }}>↑ {bull}</span>
                    <span style={{ color: T.bear }}>↓ {bear}</span>
                    <span style={{ color: T.accent, marginLeft: 'auto', fontWeight: 600 }}>
                      open →

                  </div>
                </button>

          </div>
        </section>

        {/* Trajectory + heatmap */}
        <section style={{ display: 'grid', gridTemplateColumns: '1.1fr 1fr', gap: 22 }}>
          <div>
            <SectionHeader label="Mood trajectory · stories per day"/>
            <div style={{ background: T.surface, border:`1px solid ${T.rule2}`,
                          borderRadius: T.rMd, padding:'14px 14px 10px' }}>
              <div style={{ display:'grid', gridTemplateColumns:`repeat(${days.length},1fr)`,
                            gap:8, alignItems:'flex-end', height:200 }}>
                {[...days].reverse().map(d => {
                  const bull  = d.articles.filter(a => a.sentiment==='bull').length;
                  const bear  = d.articles.filter(a => a.sentiment==='bear').length;
                  const mixed = d.articles.filter(a => a.sentiment==='mixed').length;
                  const total = d.stats.total;
                  const maxV  = Math.max(...days.map(x => x.stats.total), 1);
                  const h = (total / maxV) * 170;
                  const segH = n => total ? (n / total) * h : 0;
                  const mc = d.mood==='bull' ? T.bull : d.mood==='bear' ? T.bear :
                             d.mood==='mixed' ? T.mixed : T.neutral;
                  return (
                    <button key={d.dateKey} onClick={() => onSelectDay(d.dateKey)}

                               gap:4, height:'100%', justifyContent:'flex-end' }}>

                      <div style={{ width:'70%', display:'flex', flexDirection:'column',

                                    boxShadow:`inset 0 0 0 1px ${T.rule2}` }}>
                        {bear  > 0 && <div style={{ height: segH(bear),  background: T.bear  }}/>}
                        {mixed > 0 && <div style={{ height: segH(mixed), background: T.mixed }}/>}
                        {bull  > 0 && <div style={{ height: segH(bull),  background: T.bull  }}/>}
                      </div>
                      <div style={{ fontFamily: T.fontDisplay, fontSize:14, fontWeight:600, color: T.ink1 }}>
                        {d.dateShort}
                      </div>
                      <div style={{ width:10, height:10, background: mc, borderRadius:'50%' }}/>
                    </button>
                  );
                })}
              </div>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center',
                            marginTop:10, paddingTop:8, borderTop:`1px solid ${T.rule}`,
                            fontFamily: T.fontSans, fontSize:11, color: T.ink3 }}>
                <span>oldest →</span>
                <span style={{ display:'flex', gap:10 }}>
                  <span><LegendDot c={T.bull}/>bull</span>
                  <span><LegendDot c={T.mixed}/>mixed</span>
                  <span><LegendDot c={T.bear}/>bear</span>
                </span>
                <span>← newest</span>
              </div>
            </div>
          </div>

          <div>
            <SectionHeader label="Activity heatmap · day × category"/>
            <div style={{ background: T.surface, border:`1px solid ${T.rule2}`,
                          borderRadius: T.rMd, padding:'10px 12px' }}>
              <div style={{ display:'grid',
                            gridTemplateColumns:`100px repeat(${days.length},1fr)`,
                            gap:3, fontFamily: T.fontMono, fontSize:10, color: T.ink3 }}>
                <div/>
                {[...days].reverse().map(d => (
                  <div key={d.dateKey} style={{ textAlign:'center', padding:'2px 0' }}>
                    {d.dateShort}
                  </div>
                ))}
                {window.NEWS_DATA.categories.map(c => {
                  const reversedDays = [...days].reverse();
                  const row = reversedDays.map(d =>
                    d.articles.filter(a => a.cats.includes(c))
                  );
                  const maxV = Math.max(...row.map(a => a.length), 1);
                  return (
                    <React.Fragment key={c}>
                      <div style={{ fontFamily: T.fontSans, fontSize:11, color: T.ink2,

                        const bear = arts.filter(a => a.sentiment==='bear').length;
                        const dom  = bull >= bear ? 'bull' : 'bear';
                        const fg   = dom==='bull' ? T.bull : T.bear;
                        const intensity = 0.25 + 0.75 * (arts.length / maxV);
                        const hasP1 = arts.some(a => a.priority==='P1');
                        const dateKey = reversedDays[ci].dateKey;
                        return (
                          <div key={ci}

                            title={`${c} · ${reversedDays[ci].dateShort} — ${arts.length} ${arts.length===1?'story':'stories'}\nClick to open with ${c} filter`}
                            style={{ height:26, position:'relative',
                                     background:`color-mix(in oklab,${fg} ${Math.round(intensity*100)}%,transparent)`,
                                     border:`1px solid ${T.rule2}`,

                                     fontFamily: T.fontMono, fontSize:11, fontWeight:700,
                                     color:'#fff', cursor:'pointer',
                                     transition: 'filter .12s' }}

                            {arts.length}

          </div>

        <section style={{ display: 'grid', gridTemplateColumns: '1.4fr 1fr 1fr', gap: 22 }}>
          <div>
            <SectionHeader label="This week's biggest stories"/>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {topP1.map(a => {
                const tone = sentTone(a.sentiment);
                return (
                  <article key={a.id} style={{ background: T.surface, border: `1px solid ${T.rule2}`,
                                               borderRadius: 4, padding: '10px 12px',
                                               boxShadow: `inset 3px 0 0 0 ${T.accent}`, paddingLeft: 15 }}>
                    <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:4 }}>

                      <button onClick={() => onSelectDay(a._dayKey)}

                                 color: T.accent, background:'transparent', border:0,
                                 padding:0, cursor:'pointer' }}>{a._day}</button>
                      <span style={{ width:3, height:3, borderRadius:'50%', background: T.ink4 }}/>
                      <span style={{ fontFamily: T.fontMono, fontSize:11, color: T.ink2 }}>{a.time}</span>
                      <div style={{ flex:1 }}/>
                      <SentBadge s={a.sentiment} size={9}/>
                    </div>
                    <h3 style={{ fontFamily: T.fontDisplay, fontWeight:600, fontSize:15, lineHeight:1.25,
                                 margin:'0 0 4px', color: T.ink0 }}>{a.headline}</h3>
                    <p style={{ fontFamily: T.fontSerif, fontSize:12.5, lineHeight:1.45,
                                color: T.ink2, margin:0 }}>{a.summary}</p>
                    <div style={{ display:'flex', gap:3, marginTop:6, flexWrap:'wrap' }}>
                      {a.cats.slice(0,2).map(c => <CatLabel key={c} c={c}/>)}
                      <div style={{ flex:1 }}/>
                      {a.tickers.slice(0,4).map(t => <Ticker key={t} t={t} size={10}/>)}
                    </div>
                  </article>
                );
              })}
            </div>
          </div>

          <div>
            <SectionHeader label="Top tickers · week"/>
            <div style={{ display:'flex', flexWrap:'wrap', gap:4 }}>
              {topTickers.map(([t, n]) => {
                const sz = n >= 4 ? 14 : n >= 3 ? 12.5 : n >= 2 ? 11 : 10;
                return (
                  <span key={t} style={{ display:'inline-flex', alignItems:'center', gap:5,
                                          fontFamily: T.fontMono, fontSize:sz, fontWeight:600,
                                          background: T.surface, border:`1px solid ${T.rule2}`,
                                          borderRadius:3, padding:'3px 7px' }}>
                    {t}
                    <span style={{ fontFamily: T.fontSans, fontSize:9, fontWeight:600,
                                   color: T.ink3, background: T.paperSub,
                                   padding:'0 5px', borderRadius:8 }}>{n}</span>
                  </span>
                );
              })}
            </div>
          </div>

          <div>
            <SectionHeader label="Themes of the week"/>
            <div style={{ background: T.surface, border:`1px solid ${T.rule2}`,
                          borderRadius: T.rMd, padding:'16px 14px',
                          display:'flex', flexWrap:'wrap', gap:'8px 14px',
                          alignItems:'baseline', lineHeight: 1.6 }}>
              {themes.map(([t, n]) => {
                const max = themes[0][1];
                // Scale font size from 11px (least frequent) to 22px (most frequent)
                const sz  = 11 + Math.round((n / max) * 11);
                // Scale weight: 400 → 700
                const fw  = n === 1 ? 400 : n / max >= 0.8 ? 700 : n / max >= 0.5 ? 600 : 500;
                // Scale colour: faint → dark ink
                const col = n === max   ? T.ink0
                          : n / max >= 0.6 ? T.ink1
                          : n / max >= 0.3 ? T.ink2
                          : T.ink3;
                return (
                  <span key={t} style={{
                    fontFamily: T.fontDisplay,
                    fontSize: sz,
                    fontWeight: fw,
                    color: col,
                    letterSpacing: '-.01em',
                    transition: 'color .12s',
                    cursor: 'default',
                  }}>
                    {t}
                  </span>
                );
              })}
            </div>
          </div>
        </section>
      </div>
    </div>
  );
}

function MiniSpark({ D }) {
  const { tokens: T } = window.HF;
  const hrs = D.articles.map(a => a.hr);
  if (!hrs.length) return null;
  const HSTART = Math.min(...hrs);
  const HEND   = Math.max(...hrs);
  const span   = HEND - HSTART + 1;
  const bars   = Array.from({ length: span }, (_, i) => {
    const arts = D.articles.filter(a => a.hr === i + HSTART);
    return { bull: arts.filter(a=>a.sentiment==='bull').length,
             bear: arts.filter(a=>a.sentiment==='bear').length,
             mixed: arts.filter(a=>a.sentiment==='mixed').length };
  });
  const maxV = Math.max(...bars.map(b => b.bull+b.bear+b.mixed), 1);
  return (
    <div>
      <div style={{ display:'flex', gap:2, alignItems:'flex-end', height:32 }}>
        {bars.map((b,i) => (
          <div key={i} style={{ flex:1, display:'flex', flexDirection:'column', justifyContent:'flex-end' }}>
            {b.bear  > 0 && <div style={{ background: T.bear,  height:(b.bear/maxV)*28 }}/>}
            {b.mixed > 0 && <div style={{ background: T.mixed, height:(b.mixed/maxV)*28 }}/>}
            {b.bull  > 0 && <div style={{ background: T.bull,  height:(b.bull/maxV)*28 }}/>}
          </div>
        ))}
      </div>
      <div style={{ display:'flex', justifyContent:'space-between',
                    fontFamily: T.fontMono, fontSize:9, color: T.ink3, marginTop:3 }}>
        <span>{String(HSTART).padStart(2,'0')}</span>
        <span>{String(Math.floor((HSTART+HEND)/2)).padStart(2,'0')}</span>
        <span>{String(HEND).padStart(2,'0')}</span>
      </div>
    </div>
  );
}

function MobileDayView({ day }) {

  const [prio,    setPrio]    = React.useState(new Set());
  const [sent,    setSent]    = React.useState(new Set());
  const [cat,     setCat]     = React.useState(new Set());

  const togglePrioM = (v) => setPrio(prev => { const n = new Set(prev); n.has(v) ? n.delete(v) : n.add(v); return n; });
  const toggleSentM = (v) => setSent(prev => { const n = new Set(prev); n.has(v) ? n.delete(v) : n.add(v); return n; });
  const toggleCatM  = (c) => setCat(prev => { const n = new Set(prev); n.has(c) ? n.delete(c) : n.add(c); return n; });

  const filtered = React.useMemo(() => {
    const q = searchQ.trim().toLowerCase();
    return D.articles.filter(a => {
      if (prio.size > 0 && !prio.has(a.priority)) return false;
      if (sent.size > 0 && !sent.has(a.sentiment)) return false;
      if (cat.size  > 0 && !a.cats.some(c => cat.has(c))) return false;
      if (q) {
        const blob = [a.headline, a.summary, ...a.tickers, ...a.cats, a.source].join(' ').toLowerCase();
        if (!blob.includes(q)) return false;
      }
      return true;
    });
  }, [D.articles, searchQ, prio, sent, cat]);

  const mc = moodColor(D.mood);
  const ml = moodLabel(D.mood);

                      fontFamily: T.fontMono, fontSize:10.5, color: T.ink2 }}>
          <span><b style={{ color: T.ink0 }}>{D.stats.total}</b> stories</span>
          <span><b style={{ color: T.p1 }}>{D.stats.p12}</b> priority</span>
          <span><b style={{ color: T.bull }}>↑{D.articles.filter(a=>a.sentiment==='bull').length}</b></span>
          <span><b style={{ color: T.bear }}>↓{D.articles.filter(a=>a.sentiment==='bear').length}</b></span>

          <p style={{ fontFamily: T.fontSerif, fontSize:13, lineHeight:1.5,

          </div>
        </section>

      <section style={{ padding:'10px 16px', background: T.surface, borderBottom:`1px solid ${T.rule}` }}>
        <Eyebrow>By the hour</Eyebrow>
        <div style={{ marginTop:6 }}><MiniSpark D={D}/></div>
      </section>

      <div style={{ padding:'8px 12px', background: T.paper, borderBottom:`1px solid ${T.rule2}` }}>
        <div style={{ position:'relative', marginBottom:6 }}>
          <input value={searchQ} onChange={e => setSearchQ(e.target.value)}
                 placeholder="Search headlines, tickers…"
                 style={{ width:'100%', padding:'7px 28px 7px 28px',
                          fontFamily: T.fontSans, fontSize:12,
                          background: T.surface, color: T.ink1,

                          borderRadius:999, outline:'none' }}/>
          <span style={{ position:'absolute', left:9, top:6, color: searchQ ? T.accent : T.ink3 }}>
            <SearchIconSm/>
          </span>
          {searchQ && (
            <button onClick={() => setSearchQ('')}
              style={{ position:'absolute', right:5, top:4, width:20, height:20,

        <div style={{ display:'flex', gap:4, overflowX:'auto', whiteSpace:'nowrap', paddingBottom:2 }}>

          <Chip on={prio.has('P1')} onClick={() => togglePrioM('P1')}>P1</Chip>
          <Chip on={prio.has('P2')} onClick={() => togglePrioM('P2')}>P2</Chip>
          <Chip on={sent.has('bull')} onClick={() => toggleSentM('bull')}>Bull</Chip>
          <Chip on={sent.has('bear')} onClick={() => toggleSentM('bear')}>Bear</Chip>
          {window.NEWS_DATA.categories.map(c => (

// ─── Root app ────────────────────────────────────────────────────────────────

function App() {
  const [data,    setData]    = React.useState(null);
  const [error,   setError]   = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const [activeTab, setActiveTab] = React.useState('overview');
  const [searchQ,    setSearchQ]   = React.useState('');
  const [pendingCat, setPendingCat] = React.useState(null);
  const [isMobile, setIsMobile]   = React.useState(window.innerWidth < 768);

  React.useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth < 768);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  const fetchData = React.useCallback((bust = false) => {
    setLoading(true);
    const url = bust ? `/api/data?t=${Date.now()}` : '/api/data';
    fetch(url)
      .then(r => { if (!r.ok) throw new Error(`Server returned ${r.status}`); return r.json(); })
      .then(d => {
        if (d.error) throw new Error(d.error);
        window.NEWS_DATA = d;
        setData(d);
        setError(null);
      })
      .catch(e => setError(e.message))
      .finally(() => {
        setLoading(false);
        const el = document.getElementById('loading');
        if (el) { el.classList.add('fade'); setTimeout(() => el.remove(), 350); }
      });
  }, []);

  React.useEffect(() => { fetchData(); }, [fetchData]);

  if (error) {
    return (
      <div style={{ display:'flex', flexDirection:'column', alignItems:'center',
                    justifyContent:'center', height:'100vh',
                    background:'var(--paper)', gap:14, padding:24, textAlign:'center' }}>
        <div style={{ fontFamily:'"Newsreader",serif', fontSize:22, fontWeight:600,
                      color:'var(--ink-2)', fontStyle:'italic' }}>Could not load data</div>
        <div style={{ fontFamily:'"Hanken Grotesk",sans-serif', fontSize:13, color:'var(--ink-3)',
                      maxWidth:420, lineHeight:1.5 }}>{error}</div>
        <button onClick={() => fetchData(true)}
          style={{ fontFamily:'"Hanken Grotesk",sans-serif', fontSize:13, fontWeight:600,
                   color:'#fff', background:'var(--accent)', border:0,
                   borderRadius:999, padding:'9px 22px', cursor:'pointer' }}>Try again</button>
      </div>
    );
  }

  if (!data) return null;

  if (isMobile) return <HifiMobile/>;

  const handleTabSelect = (tab, cat = null) => {
    setActiveTab(tab);
    setPendingCat(cat);
  };

  return (
    <DashboardShell tabs={data.days} active={activeTab} onSelect={handleTabSelect}
                    onRefresh={() => fetchData(true)} loading={loading}
                    searchQ={searchQ} setSearchQ={setSearchQ}>
      {activeTab === 'overview'
        ? <HifiOverview days={data.days} weekThemes={data.weekThemes || []} onSelectDay={handleTabSelect}/>
        : <HifiDesktop day={data.days.find(d => d.dateKey === activeTab) || data.days[0]}
                       searchQ={searchQ} setSearchQ={setSearchQ}
                       initialCat={pendingCat}/>}
    </DashboardShell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(

);
